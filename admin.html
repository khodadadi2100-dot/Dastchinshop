<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008d4f"><title>دستچین | پنل مدیریت</title><style>:root{--g:#008d4f;--navy:#082e5b;--bg:#eef7f5;--red:#d93b3b;--line:#e5ece8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eaf5f4,#f8fbfb);font-family:Tahoma,"Segoe UI",sans-serif;color:var(--navy)}button,input,select{font:inherit}button{border:0;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:12px 12px 90px}.top{background:var(--g);color:#fff;border-radius:22px;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:8px;z-index:5}.top h1{margin:0;font-size:20px}.btn{padding:10px 13px;border-radius:12px;font-weight:900}.white{background:#fff;color:var(--g)}.dark{background:var(--navy);color:#fff}.red{background:var(--red);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.stat,.panel{background:#fff;border-radius:20px;padding:15px;box-shadow:0 3px 16px #1f3d4c20}.stat b{display:block;font-size:24px;margin-top:5px}.tabs{display:flex;gap:8px;margin:14px 0;overflow:auto}.tab{padding:11px 15px;border-radius:13px;background:#fff;color:#708094;white-space:nowrap}.tab.active{background:var(--g);color:#fff}.panel h2{margin:0 0 12px}.order{border:1px solid var(--line);border-radius:17px;padding:13px;margin:9px 0}.orderTop{display:flex;justify-content:space-between;gap:10px}.status{padding:5px 9px;border-radius:10px;background:#eaf7f0;color:var(--g);font-size:11px}.muted{color:#7b8798;font-size:12px;line-height:1.9}.items{margin:10px 0;padding:9px;background:#f7faf9;border-radius:13px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #e9efec;padding:6px 0}.item:last-child{border:0}.order select{width:100%;padding:9px;border:1px solid #dbe5e0;border-radius:11px;margin-top:9px}.customer{padding:10px;border-bottom:1px solid var(--line)}.product{display:grid;grid-template-columns:65px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.thumb{width:65px;height:65px;object-fit:contain;border-radius:12px;background:#f7faf9}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="wrap"><header class="top"><h1>دستچین | پنل مدیریت</h1><div><button class="btn white" id="home">فروشگاه</button><button class="btn red" id="logout">خروج</button></div></header><section class="stats"><div class="stat">محصولات فعال<b id="sp">—</b></div><div class="stat">سفارش جدید<b id="sn">—</b></div><div class="stat">همه سفارش‌ها<b id="so">—</b></div><div class="stat">فروش<b id="ss">—</b></div></section><div class="tabs"><button class="tab active" data-t="orders">سفارش‌ها</button><button class="tab" data-t="customers">مشتری‌ها</button><button class="tab" data-t="products">محصولات</button></div><section class="panel" id="orders"><h2>سفارش‌ها</h2><div id="ordersList">در حال بارگذاری...</div></section><section class="panel" id="customers" style="display:none"><h2>مشتری‌ها</h2><div id="customersList"></div></section><section class="panel" id="products" style="display:none"><h2>محصولات</h2><div id="productsList"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(async()=>{const sb=supabase.createClient(window.DASTCHIN_SUPABASE_URL,window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fa-IR');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fa=s=>({new:'جدید',confirmed:'تأیید شده',preparing:'در حال آماده‌سازی',out_for_delivery:'در حال ارسال',delivered:'تحویل شده',cancelled:'لغو شده'})[s]||s;
const {data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return}const {data:me}=await sb.from('profiles').select('role').eq('id',session.user.id).single();if(me?.role!=='admin'){document.body.innerHTML='<div style="padding:30px;font-family:Tahoma">دسترسی به پنل مدیریت ندارید.</div>';return}$('home').onclick=()=>location.href='index.html';$('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};
async function load(){const [pr,or,cs,ad,oi]=await Promise.all([sb.from('products').select('*').order('sort_order'),sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100),sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(300),sb.from('addresses').select('*'),sb.from('order_items').select('*').order('id')]);const ps=pr.data||[],os=or.data||[],profiles=cs.data||[],addresses=ad.data||[],items=oi.data||[];$('sp').textContent=ps.filter(p=>p.active).length;$('sn').textContent=os.filter(o=>o.status==='new').length;$('so').textContent=os.length;$('ss').textContent=money(os.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+Number(o.total||0),0))+' تومان';renderOrders(os,profiles,addresses,items);renderCustomers(profiles,os);renderProducts(ps)}
function renderOrders(os,ps,ads,items){$('ordersList').innerHTML=os.length?os.map(o=>{const c=ps.find(x=>x.id===o.user_id)||{};const a=ads.find(x=>x.id===o.address_id)||{};const its=items.filter(x=>x.order_id===o.id);return `<div class="order"><div class="orderTop"><b>سفارش #${o.id}</b><span class="status">${fa(o.status)}</span></div><div><b>مشتری:</b> ${esc(c.full_name||'بدون نام')}</div><div class="muted">📱 ${esc(c.phone||'ثبت نشده')}<br>📍 ${esc(a.address||a.address_text||'ثبت نشده')}<br>🕐 ${new Date(o.created_at).toLocaleString('fa-IR')}</div><div class="items"><b>محصولات سفارش:</b>${its.length?its.map(i=>`<div class="item"><span>${esc(i.product_name)} × ${i.quantity}</span><b>${money(i.line_total)}</b></div>`).join(''):'<div class="muted">جزئیات کالا موجود نیست</div>'}</div><div><b>مبلغ کل: ${money(o.total)} تومان</b></div><select data-id="${o.id}">${['new','confirmed','preparing','out_for_delivery','delivered','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${fa(s)}</option>`).join('')}</select></div>`}).join(''):'هنوز سفارشی ثبت نشده است';document.querySelectorAll('[data-id]').forEach(s=>s.onchange=async()=>{const r=await sb.from('orders').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.id);if(r.error)alert(r.error.message);else load()})}
function renderCustomers(cs,os){$('customersList').innerHTML=cs.filter(c=>c.role!=='admin').map(c=>{const mine=os.filter(o=>o.user_id===c.id);return `<div class="customer"><b>${esc(c.full_name||'بدون نام')}</b><div class="muted">${esc(c.phone||'')} · ${mine.length} سفارش</div></div>`}).join('')||'مشتری‌ای نیست'}function renderProducts(ps){$('productsList').innerHTML=ps.map(p=>`<div class="product"><img class="thumb" src="${esc(p.image_url||'')}"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} تومان · موجودی ${p.stock} · ${p.active?'فعال':'غیرفعال'}</div></div><span>${esc(p.category)}</span></div>`).join('')}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['orders','customers','products'].forEach(k=>$(k).style.display=t.dataset.t===k?'block':'none')});load();setInterval(load,15000)})();</script></body></html>
