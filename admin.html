<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008d4f"><title>دستچین | پنل مدیریت</title><style>
:root{--g:#008d4f;--navy:#082e5b;--bg:#eef7f5;--red:#d93b3b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf5f4,#f8fbfb);font-family:Tahoma,"Segoe UI",sans-serif;color:var(--navy)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:16px 12px 100px}.top{background:var(--g);color:#fff;border-radius:22px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:8px;z-index:10;box-shadow:0 5px 22px #0002}.top h1{font-size:20px;margin:0}.top .actions{display:flex;gap:8px}.btn{padding:10px 13px;border-radius:13px;font-weight:800}.white{background:#fff;color:var(--g)}.dark{background:var(--navy);color:#fff}.red{background:var(--red);color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}.stat{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 16px #1f3d4c20}.stat b{font-size:24px;display:block;margin-top:5px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;background:#fff;color:#708094;padding:11px 14px;border-radius:14px}.tab.active{background:var(--g);color:#fff}.panel{background:#fff;border-radius:20px;padding:14px;box-shadow:0 3px 16px #1f3d4c20;margin-top:12px}.panel h2{margin:0 0 12px;font-size:19px}.row{display:grid;grid-template-columns:1fr;gap:8px;padding:11px 0;border-bottom:1px solid #eef1f0}.row:last-child{border-bottom:0}.input{width:100%;border:1px solid #dfe7e3;border-radius:12px;padding:11px;outline:none}.product-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#f3f5f5}.muted{color:#7b8798;font-size:12px}.badge{padding:4px 8px;border-radius:10px;background:#e9f7ef;color:var(--g);font-size:11px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.open{display:flex}.sheet{background:#fff;width:min(600px,100%);border-radius:26px 26px 0 0;padding:18px;max-height:92vh;overflow:auto}.form{display:grid;gap:9px}.form .save{background:var(--g);color:#fff;border-radius:13px;padding:12px;font-weight:900}.close{float:left;border:0;background:#edf5f1;border-radius:50%;width:36px;height:36px}.msg{font-size:13px;line-height:1.8;margin-top:6px}.order{border:1px solid #e5ece8;border-radius:15px;padding:11px;margin:8px 0}.order-head{display:flex;justify-content:space-between;gap:8px}.status{background:#eef7f5;color:var(--g);border-radius:9px;padding:4px 8px;font-size:11px}.order select{border:1px solid #ddd;border-radius:10px;padding:8px;margin-top:8px;width:100%}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:26px}.row{grid-template-columns:1fr auto;align-items:center}.product-row{grid-template-columns:72px 1fr auto}.thumb{width:72px;height:72px}}
</style></head><body><div class="wrap"><header class="top"><h1>دستچین | پنل مدیریت</h1><div class="actions"><button class="btn white" id="homeBtn">فروشگاه</button><button class="btn red" id="logoutBtn">خروج</button></div></header><section class="grid"><div class="stat">محصولات فعال<b id="statProducts">—</b></div><div class="stat">سفارش‌های جدید<b id="statNew">—</b></div><div class="stat">همه سفارش‌ها<b id="statOrders">—</b></div><div class="stat">فروش ثبت‌شده<b id="statSales">—</b></div></section><div class="tabs"><button class="tab active" data-tab="orders">سفارش‌ها</button><button class="tab" data-tab="products">محصولات</button><button class="tab" data-tab="customers">مشتری‌ها</button></div><section class="panel" id="ordersPanel"><h2>مدیریت سفارش‌ها</h2><div id="ordersList">در حال بارگذاری...</div></section><section class="panel" id="productsPanel" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><h2>محصولات</h2><button class="btn dark" id="addProduct">+ محصول</button></div><div id="productsList">در حال بارگذاری...</div></section><section class="panel" id="customersPanel" style="display:none"><h2>مشتری‌ها</h2><div id="customersList">در حال بارگذاری...</div></section></div><div class="modal" id="productModal"><div class="sheet"><button class="close" id="closeModal">×</button><h2 id="modalTitle">افزودن محصول</h2><form class="form" id="productForm"><input type="hidden" id="productId"><input class="input" id="pName" placeholder="نام محصول"><input class="input" id="pSlug" placeholder="slug انگلیسی، مثال milk"><input class="input" id="pCategory" value="لبنیات" placeholder="دسته"><input class="input" id="pMeta" placeholder="مثلاً ۱ لیتری"><input class="input" id="pPrice" type="number" placeholder="قیمت تومان"><input class="input" id="pStock" type="number" placeholder="موجودی"><label>تصویر محصول <input class="input" id="pImage" type="file" accept="image/*"></label><label><input id="pActive" type="checkbox" checked> فعال باشد</label><button class="save">ذخیره محصول</button><div class="msg" id="formMsg"></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(async()=>{const enabled=!!(window.DASTCHIN_SUPABASE_URL&&window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY&&window.supabase);if(!enabled){document.body.innerHTML='<div style="padding:25px;font-family:Tahoma;line-height:2">ابتدا <b>supabase-config.js</b> را تنظیم کنید.</div>';return}const sb=supabase.createClient(DASTCHIN_SUPABASE_URL,DASTCHIN_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return}const {data:me}=await sb.from('profiles').select('role').eq('id',session.user.id).single();if(me?.role!=='admin'){document.body.innerHTML='<div style="padding:25px;font-family:Tahoma">دسترسی به پنل مدیریت ندارید.</div>';return}
const $=id=>document.getElementById(id), money=n=>Number(n||0).toLocaleString('fa-IR');$('homeBtn').onclick=()=>location.href='index.html';$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};
async function load(){const [{data:ps},{data:os},{data:cs}]=await Promise.all([sb.from('products').select('*').order('sort_order'),sb.from('orders').select('id,user_id,status,total,created_at,payment_status,address_id').order('created_at',{ascending:false}).limit(100),sb.from('profiles').select('id,full_name,phone,role,created_at').order('created_at',{ascending:false}).limit(200)]);$('statProducts').textContent=(ps||[]).filter(p=>p.active).length;$('statNew').textContent=(os||[]).filter(o=>o.status==='new').length;$('statOrders').textContent=(os||[]).length;$('statSales').textContent=money((os||[]).filter(o=>o.status!=='cancelled').reduce((a,b)=>a+(b.total||0),0))+' تومان';renderOrders(os||[],cs||[]);renderProducts(ps||[]);renderCustomers(cs||[])}
function renderOrders(os,cs){$('ordersList').innerHTML=os.length?os.map(o=>{const c=cs.find(x=>x.id===o.user_id);return `<div class="order"><div class="order-head"><b>${c?.full_name||'مشتری'}</b><span class="status">${fa(o.status)}</span></div><div class="muted">${c?.phone||''} · ${new Date(o.created_at).toLocaleString('fa-IR')}</div><div>مبلغ: <b>${money(o.total)} تومان</b></div><select data-order="${o.id}" class="statusSelect">${['new','confirmed','preparing','out_for_delivery','delivered','cancelled'].map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${fa(s)}</option>`).join('')}</select></div>`}).join(''):'سفارشی نیست';document.querySelectorAll('.statusSelect').forEach(x=>x.onchange=async()=>{const {error}=await sb.from('orders').update({status:x.value,updated_at:new Date().toISOString()}).eq('id',x.dataset.order);if(error)alert(error.message);else load()})}
function fa(s){return ({new:'جدید',confirmed:'تأیید شده',preparing:'در حال آماده‌سازی',out_for_delivery:'در مسیر ارسال',delivered:'تحویل شده',cancelled:'لغو شده'})[s]||s}
function renderProducts(ps){$('productsList').innerHTML=ps.map(p=>`<div class="row"><div class="product-row"><img class="thumb" src="${esc(p.image_url)}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.meta)} · ${money(p.price)} تومان · موجودی ${p.stock}</div><span class="badge">${p.active?'فعال':'غیرفعال'}</span></div><div><button class="btn dark edit" data-id="${p.id}">ویرایش</button><button class="btn red del" data-id="${p.id}">حذف</button></div></div></div>`).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(ps.find(p=>p.id===b.dataset.id)));document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('حذف شود؟')){const {error}=await sb.from('products').delete().eq('id',b.dataset.id);if(error)alert(error.message);load()}})}
function esc(x=''){return x.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openForm(p=null){$('productModal').classList.add('open');$('modalTitle').textContent=p?'ویرایش محصول':'افزودن محصول';$('productId').value=p?.id||'';$('pName').value=p?.name||'';$('pSlug').value=p?.slug||'';$('pCategory').value=p?.category||'لبنیات';$('pMeta').value=p?.meta||'';$('pPrice').value=p?.price||'';$('pStock').value=p?.stock??100;$('pActive').checked=p?.active??true;$('pImage').value='';$('formMsg').textContent=''}function edit(p){openForm(p)}$('addProduct').onclick=()=>openForm();$('closeModal').onclick=()=>$('productModal').classList.remove('open');$('productModal').onclick=e=>{if(e.target.id==='productModal')$('productModal').classList.remove('open')};
$('productForm').onsubmit=async e=>{e.preventDefault();let imageUrl='';const id=$('productId').value;const file=$('pImage').files[0];if(file){const ext=file.name.split('.').pop().toLowerCase();const path=`products/${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});if(up.error){$('formMsg').textContent=up.error.message;return}imageUrl=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}const payload={name:$('pName').value.trim(),slug:$('pSlug').value.trim(),category:$('pCategory').value.trim(),meta:$('pMeta').value.trim(),price:Number($('pPrice').value),stock:Number($('pStock').value),active:$('pActive').checked,updated_at:new Date().toISOString()};if(imageUrl)payload.image_url=imageUrl;const res=id?await sb.from('products').update(payload).eq('id',id):await sb.from('products').insert({...payload,sort_order:100});if(res.error){$('formMsg').textContent=res.error.message;return}$('formMsg').textContent='ذخیره شد ✓';setTimeout(()=>{$('productModal').classList.remove('open');load()},500)};
function renderCustomers(cs){$('customersList').innerHTML=cs.map(c=>`<div class="row"><b>${esc(c.full_name||'بدون نام')}</b><div class="muted">${esc(c.phone||'')} · ${esc(c.role)}</div></div>`).join('')||'مشتری‌ای نیست'}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['orders','products','customers'].forEach(k=>$(k+'Panel').style.display=t.dataset.tab===k?'block':'none')});load();})();</script></body></html>
