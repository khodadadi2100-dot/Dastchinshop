<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087a4b"><title>دستچین | تازه، سالم، دستچین شده برای شما</title>
<style>
:root{--g:#087a4b;--g2:#05643e;--light:#f2f8f5;--text:#18382d;--muted:#71807b;--line:#e2ebe6;--red:#e94b4b;--shadow:0 8px 24px rgba(20,65,48,.09)}*{box-sizing:border-box}body{margin:0;background:#edf6f2;color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding-bottom:90px}.header{height:158px;background:linear-gradient(135deg,#05663f,#0aa05f);border-radius:0 0 34px 34px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.header:before{content:"";position:absolute;left:50%;top:-125px;transform:translateX(-50%);width:450px;height:225px;background:#fff;border-radius:0 0 230px 230px}.brand{position:absolute;z-index:2;left:50%;top:13px;transform:translateX(-50%);width:330px;height:112px;display:grid;place-items:center}.brand img{width:100%;height:100%;object-fit:contain}.icon{position:absolute;z-index:3;border:0;cursor:pointer;width:53px;height:53px;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;font-size:25px}.menu{right:20px;top:49px}.cart{left:86px;top:49px}.user{left:20px;top:49px;background:#fff;color:var(--g);border-radius:50%}.badge{position:absolute;right:-5px;top:-6px;background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;min-width:23px;height:23px;font-size:11px;display:grid;place-items:center}.hero{margin:18px 18px 14px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}.hero img{width:100%;display:block;aspect-ratio:1024/390;object-fit:cover}.search{height:58px;margin:0 18px 20px;background:#fff;border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;padding:0 17px;box-shadow:var(--shadow)}.search b{font-size:27px;color:var(--g);margin-left:9px}.search input{border:0;outline:0;width:100%;font:inherit;font-size:14px;background:transparent;text-align:right}.section{margin:0 18px 23px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.top h2{font-size:20px;margin:0}.all{border:0;background:none;color:#1787c2;font-weight:bold;cursor:pointer}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.cat{border:1px solid var(--line);background:#fff;border-radius:21px;padding:8px;cursor:pointer;color:#53635e;font-weight:bold;box-shadow:0 4px 15px rgba(20,65,48,.05)}.cat .pic{height:72px;border-radius:17px;background:#eef8f3;display:grid;place-items:center;font-size:36px;margin-bottom:7px}.cat.active{border:2px solid var(--g);color:var(--g)}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:9px;box-shadow:var(--shadow)}.picprod{height:180px;border-radius:18px;background:#f8fbfa;overflow:hidden;display:grid;place-items:center}.picprod img{width:100%;height:100%;object-fit:contain}.name{text-align:center;font-weight:900;margin-top:9px}.meta{text-align:center;color:var(--muted);font-size:11px;margin-top:4px}.price{text-align:center;color:var(--g);font-weight:900;margin:8px}.add{height:42px;width:100%;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:13px;font-weight:900;cursor:pointer}.add:active{transform:scale(.98)}.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(1100px,100%);height:76px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -8px 25px rgba(0,0,0,.08);display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:none;color:#87928f;font-size:22px;cursor:pointer;display:grid;place-items:center;gap:2px}.nav small{font-size:10px}.nav.active{color:var(--g);font-weight:900}.shade{display:none;position:fixed;inset:0;background:#0008;z-index:50}.shade.on{display:block}.panel{position:fixed;z-index:60;top:0;bottom:0;width:min(430px,94vw);background:#fff;box-shadow:0 0 30px #0003;transition:.25s;padding-bottom:15px;display:flex;flex-direction:column}.drawer{right:0;transform:translateX(105%)}.drawer.open{transform:translateX(0)}.cartpanel{left:0;transform:translateX(-105%)}.cartpanel.open{transform:translateX(0)}.phead{padding:20px;background:linear-gradient(135deg,var(--g2),#0aa05f);color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:20px}.close{border:0;background:none;color:#fff;font-size:30px}.pbody{padding:17px;overflow:auto}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;cursor:pointer}.green{background:var(--g);color:#fff}.blue{background:#123d68;color:#fff;margin-top:9px}.admin{display:block;text-align:center;text-decoration:none;background:#f0f5f3;color:#123d68;border-radius:14px;padding:13px;margin-top:9px;font-weight:900}.cartitem{display:grid;grid-template-columns:55px 1fr auto;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.cartitem img{width:55px;height:55px;object-fit:contain;background:#f7faf8;border-radius:12px}.qty{display:flex;gap:5px;align-items:center}.qty button{border:0;width:28px;height:28px;border-radius:8px;background:#e8f4ee;color:var(--g);font-weight:900}.cartfoot{margin-top:auto;padding:15px;border-top:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:35px 10px}.toast{display:none;position:fixed;z-index:100;bottom:92px;left:50%;transform:translateX(-50%);background:#173d31;color:#fff;border-radius:14px;padding:11px 17px;font-size:13px}.toast.show{display:block}@media(max-width:760px){.header{height:143px}.header:before{width:72vw;height:177px}.brand{width:72vw;height:108px;top:8px}.hero{margin:0 0 14px;border-radius:0 0 27px 27px}.hero img{aspect-ratio:1024/430}.search{margin:0 13px 17px}.section{margin:0 12px 19px}.cats{gap:7px}.cat{font-size:11px;padding:7px 4px}.cat .pic{height:59px;font-size:31px}.products{grid-template-columns:repeat(2,1fr);gap:9px}.card{border-radius:19px;padding:8px}.picprod{height:153px}.name{font-size:14px}.price{font-size:14px}.menu{right:14px}.cart{left:77px}.user{left:14px}}
</style></head>
<body>
<div class="app">
<header class="header"><button class="icon menu" id="menu">☰</button><div class="brand"><img src="logo-header.svg" alt="دستچین"></div><button class="icon cart" id="openCart">🛒<span class="badge" id="count">0</span></button><button class="icon user" id="user">♙</button></header>
<section class="hero"><img src="hero-approved.jpg" alt="محصولات تازه دستچین"></section>
<div class="search"><b>⌕</b><input id="search" placeholder="جستجوی محصول..."></div>
<section class="section"><div class="top"><h2>دسته‌بندی‌ها</h2><button class="all" id="all">همه</button></div><div class="cats"><button class="cat" data-cat="لبنیات"><div class="pic">🥛</div>لبنیات</button><button class="cat" data-cat="پروتئین"><div class="pic">🥩</div>پروتئین</button><button class="cat" data-cat="شوریجات"><div class="pic">🥒</div>شوریجات</button><button class="cat" data-cat="محلی"><div class="pic">🧺</div>محلی</button></div></section>
<section class="section"><div class="top"><h2>محصولات دستچین</h2><button class="all" id="fresh">تازه‌سازی</button></div><div class="products" id="products"></div></section>
</div>
<nav class="bottom"><button class="nav active" onclick="scrollTo({top:0,behavior:'smooth'})">⌂<small>خانه</small></button><button class="nav" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">▦<small>محصولات</small></button><button class="nav" id="bottomCart">🛒<small>سبد خرید</small></button><button class="nav" id="track">◷<small>پیگیری</small></button><button class="nav" id="account">♙<small>حساب من</small></button></nav>
<div class="shade" id="shade"></div>
<aside class="panel drawer" id="drawer"><div class="phead"><b>منوی دستچین</b><button class="close" id="closeDrawer">×</button></div><div class="pbody"><button class="btn green" id="login">ورود / ثبت‌نام</button><button class="btn blue" id="track2">پیگیری سفارش</button><a class="admin" href="admin.html">پنل مدیریت</a><p style="color:var(--muted);font-size:12px;line-height:2">خرید ساده، محصولات تازه و ارسال مستقیم تا خانه شما.</p></div></aside>
<aside class="panel cartpanel" id="cartPanel"><div class="phead"><b>سبد خرید</b><button class="close" id="closeCart">×</button></div><div class="pbody" id="cartList"></div><div class="cartfoot"><div id="total" style="font-weight:900;margin-bottom:10px"></div><button class="btn green" id="checkout">ادامه ثبت سفارش</button></div></aside>
<div class="toast" id="toast"></div>
<script>
const products=[{id:1,n:'شیر محلی',m:'۱ لیتری',p:76000,i:'product-milk.jpg',c:'لبنیات'},{id:2,n:'ماست',m:'۱.۵ کیلوگرم',p:153000,i:'product-yogurt.jpg',c:'لبنیات'},{id:3,n:'دوغ',m:'۱.۵ لیتری',p:96000,i:'product-doogh.jpg',c:'لبنیات'},{id:4,n:'پنیر محلی',m:'۱ کیلوگرم',p:220000,i:'product-cheese.jpg',c:'لبنیات'},{id:5,n:'خامه محلی',m:'۲۰۰ گرمی',p:27000,i:'product-cream.jpg',c:'لبنیات'},{id:6,n:'ماست چکیده',m:'۱ کیلوگرم',p:320000,i:'product-strained.jpg',c:'لبنیات'},{id:7,n:'ماست و موسیر',m:'۱ کیلوگرم',p:210000,i:'product-musir.jpg',c:'لبنیات'},{id:8,n:'کشک سنتی',m:'۴۵۰ گرمی',p:28000,i:'product-kashk.jpg',c:'لبنیات'}];
let cart=JSON.parse(localStorage.getItem('dastchin_cart')||'{}'),cat='';const $=x=>document.getElementById(x),money=n=>Number(n).toLocaleString('fa-IR')+' تومان';
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function render(){let q=$('search').value.trim().toLowerCase();let list=products.filter(x=>(!cat||x.c===cat)&&(!q||x.n.toLowerCase().includes(q)||x.m.includes(q)));$('products').innerHTML=list.map(x=>`<article class="card"><div class="picprod"><img src="${x.i}" alt="${x.n}" onerror="this.style.display='none'"></div><div class="name">${x.n}</div><div class="meta">${x.m}</div><div class="price">${money(x.p)}</div><button class="add" onclick="add(${x.id})">افزودن به سبد</button></article>`).join('')||'<div class="empty" style="grid-column:1/-1">محصولی پیدا نشد</div>';document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));renderCart()}
function add(id){cart[id]=(cart[id]||0)+1;save();toast('محصول به سبد اضافه شد');openCart()}
function save(){localStorage.setItem('dastchin_cart',JSON.stringify(cart));renderCart()}
function renderCart(){let ids=Object.keys(cart).filter(id=>cart[id]>0);$('count').textContent=ids.reduce((s,id)=>s+cart[id],0).toLocaleString('fa-IR');if(!ids.length){$('cartList').innerHTML='<div class="empty">سبد خرید شما خالی است</div>';$('total').textContent='جمع کل: ۰ تومان';return}let total=0;$('cartList').innerHTML=ids.map(id=>{let x=products.find(p=>p.id==id),q=cart[id];total+=x.p*q;return `<div class="cartitem"><img src="${x.i}"><div><b>${x.n}</b><div style="font-size:11px;color:var(--muted)">${money(x.p)}</div></div><div class="qty"><button onclick="change(${id},-1)">−</button><b>${q}</b><button onclick="change(${id},1)">+</button></div></div>`}).join('');$('total').textContent='جمع کل: '+money(total)}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save()}
function openCart(){$('cartPanel').classList.add('open');$('shade').classList.add('on')};function openMenu(){$('drawer').classList.add('open');$('shade').classList.add('on')};function close(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));$('shade').classList.remove('on')}
$('menu').onclick=openMenu;$('openCart').onclick=openCart;$('bottomCart').onclick=openCart;$('closeDrawer').onclick=close;$('closeCart').onclick=close;$('shade').onclick=close;$('search').oninput=render;$('fresh').onclick=()=>{ $('search').value='';cat='';render();toast('فهرست تازه شد')};$('all').onclick=()=>{cat='';render()};document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});$('login').onclick=()=>toast('ورود و ثبت‌نام به‌زودی فعال می‌شود');$('user').onclick=openMenu;$('track').onclick=$('track2').onclick=()=>toast('برای پیگیری سفارش، کد سفارش خود را آماده کنید');$('account').onclick=openMenu;$('checkout').onclick=()=>toast(Object.keys(cart).length?'ثبت سفارش حضوری آماده است':'سبد خرید خالی است');render();
</script></body></html>
