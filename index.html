let products=[
{id:'milk',name:'شیر',meta:'۱ لیتری',price:38000,img:'product-milk.jpg'},
{id:'yogurt',name:'ماست',meta:'۹۰۰ گرمی',price:34000,img:'product-yogurt.jpg'},
{id:'doogh',name:'دوغ',meta:'۱.۵ لیتری',price:28000,img:'product-doogh.jpg'},
{id:'cheese',name:'پنیر',meta:'۴۰۰ گرمی',price:48000,img:'product-cheese.jpg'},
{id:'cream',name:'خامه',meta:'۲۰۰ گرمی',price:48000,img:'product-cream.jpg'},
{id:'strained-yogurt',name:'ماست چکیده',meta:'۴۰۰ گرمی',price:52000,img:'product-strained.jpg'},
{id:'mast-o-musir',name:'ماست و موسیر',meta:'۵۰۰ گرمی',price:48000,img:'product-musir.jpg'},
{id:'kashk',name:'کشک',meta:'۴۵۰ گرمی',price:45000,img:'product-kashk.jpg'}];
let cart={};
async function loadProductsFromBackend(){
  const backend=window.DastchinBackend;
  if(!backend?.enabled) return;
  const {data,error}=await backend.sb.from('products').select('id,name,slug,meta,price,image_url,active,stock,sort_order').eq('active',true).order('sort_order');
  if(error){console.error('Dastchin products load error:',error);return;}
  if(!data?.length) return;
  const localImg={milk:'product-milk.jpg',yogurt:'product-yogurt.jpg',doogh:'product-doogh.jpg',cheese:'product-cheese.jpg',cream:'product-cream.jpg','strained-yogurt':'product-strained.jpg','mast-o-musir':'product-musir.jpg',kashk:'product-kashk.jpg'};
  products=data.map(p=>({id:p.slug,name:p.name,meta:p.meta||'',price:Number(p.price||0),img:localImg[p.slug]||'product-milk.jpg',dbId:p.id,stock:Number(p.stock||0),imageUrl:p.image_url}));
  renderProducts(); updateCart();
}

const money=n=>n.toLocaleString('fa-IR');
const $=id=>document.getElementById(id);
function totals(){let count=0,total=0;products.forEach(p=>{let q=cart[p.id]||0;count+=q;total+=q*p.price});return{count,total}}
function renderProducts(list=products){$('products').innerHTML=list.map(p=>`<article class="product-card"><div class="product-image"><img src="${window.A?.[p.img]||p.imageUrl||''}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src=window.A?.[p.img]||'';"></div><div class="product-name">${p.name}</div><div class="product-meta">${p.meta}</div><div class="product-price">${money(p.price)} تومان</div><button class="add-btn" data-id="${p.id}">افزودن <span class="mini-cart">🛒</span></button></article>`).join('');document.querySelectorAll('.add-btn').forEach(b=>b.onclick=()=>{cart[b.dataset.id]=(cart[b.dataset.id]||0)+1;updateCart();toast('محصول به سبد خرید اضافه شد')})}
function updateCart(){const t=totals();['cartBadge','bottomBadge','cartItems'].forEach(id=>$(id).textContent=t.count);$('cartTotal').textContent=money(t.total);$('panelTotal').textContent=money(t.total)+' تومان';$('cartList').innerHTML=products.filter(p=>cart[p.id]).map(p=>`<div class="cart-row"><img src="${window.A?.[p.img]||p.imageUrl||''}"><div><b>${p.name}</b><small>${p.meta}</small><span>${money(p.price)} تومان</span></div><div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><b>${cart[p.id]}</b><button onclick="changeQty('${p.id}',1)">+</button></div></div>`).join('')||'<p class="empty">سبد خرید خالی است.</p>'}
function changeQty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];updateCart()}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function openPanel(el){el.classList.add('open');$('overlay').classList.add('show');document.body.classList.add('panel-open')}
function closePanels(){document.querySelectorAll('.drawer,.cart-panel').forEach(x=>x.classList.remove('open'));$('overlay').classList.remove('show');document.body.classList.remove('panel-open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});
$('menuBtn').onclick=()=>openPanel($('drawer'));$('closeDrawer').onclick=closePanels;$('adminMenuItem').onclick=()=>{closePanels();location.href='admin.html'};$('cartBtn').onclick=()=>{updateCart();openPanel($('cartPanel'))};$('viewCart').onclick=()=>{updateCart();openPanel($('cartPanel'))};$('closeCart').onclick=closePanels;$('overlay').onclick=closePanels;
$('checkoutBtn').onclick=()=>toast('سفارش شما آماده ثبت است — پرداخت هنگام تحویل');$('profileBtn').onclick=()=>toast('پروفایل در مرحله بعدی به حساب کاربری واقعی متصل می‌شود');
$('showAll').onclick=()=>{$('searchInput').value='';renderProducts();document.querySelector('.products-section').scrollIntoView({behavior:'smooth'})};
$('searchInput').addEventListener('input',e=>{const q=e.target.value.trim();renderProducts(q?products.filter(p=>(p.name+' '+p.meta).includes(q)):products)});
document.querySelectorAll('.category').forEach(c=>c.onclick=()=>{document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));c.classList.add('active');if(c.dataset.cat==='dairy')renderProducts();else{renderProducts([]);toast('این دسته در نسخه بعدی فعال می‌شود')}});
$('geoBtn').onclick=()=>{const s=$('geoStatus');if(!navigator.geolocation){s.textContent='مرورگر شما موقعیت مکانی را پشتیبانی نمی‌کند.';return}s.textContent='در حال دریافت موقعیت...';navigator.geolocation.getCurrentPosition(pos=>{s.textContent=`موقعیت ثبت شد: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;toast('موقعیت شما دریافت شد')},()=>s.textContent='اجازه دسترسی به موقعیت داده نشد.')};
document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));n.classList.add('active');const t=n.dataset.target;if(t==='home')scrollTo({top:0,behavior:'smooth'});if(t==='categories')document.querySelector('.categories-box').scrollIntoView({behavior:'smooth'});if(t==='cart'){updateCart();openPanel($('cartPanel'))}if(t==='map')document.querySelector('.delivery').scrollIntoView({behavior:'smooth'});if(t==='orders'||t==='support')toast(t==='orders'?'هنوز سفارشی ثبت نشده است':'پشتیبانی دستچین آماده پاسخگویی است')});
renderProducts();updateCart();
</script>

window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_hkQHmGJCe3Mm96JvIn6QEg_N5dqCMhV';

if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')}
</script>
<script>
(function(){
  const cfg={url:window.DASTCHIN_SUPABASE_URL,key:window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY};
  const sdkReady=!!window.supabase;
  const enabled=!!(cfg.url&&cfg.key&&sdkReady);
  const sb=enabled?window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
  window.DastchinBackend={enabled,sb};
  window.DastchinBackend.sdkReady=sdkReady;
  window.DastchinBackend.health=async()=>{if(!enabled)return {ok:false,error:'sdk'};const {data,error}=await sb.from('products').select('id').limit(1);return {ok:!error,error:error?.message,data};};
  const modal=document.getElementById('authModal'), content=document.getElementById('authContent'), title=document.getElementById('authTitle');
  const money2=n=>Number(n||0).toLocaleString('fa-IR');
  const open=()=>modal.classList.add('open'), close=()=>modal.classList.remove('open');
  document.getElementById('authClose').onclick=close;
  modal.addEventListener('click',e=>{if(e.target===modal)close()});

  async function session(){if(!sb)return null; const {data}=await sb.auth.getSession(); return data.session;}
  async function profile(){const s=await session(); if(!s)return null; const {data}=await sb.from('profiles').select('*').eq('id',s.user.id).single(); return data;}
  function authForm(){title.textContent='ورود / ثبت‌نام';content.innerHTML=`<div class="auth-msg">برای ثبت سفارش، ذخیره آدرس و مشاهده سفارش‌ها وارد حساب شوید.</div><form class="auth-form" id="authForm"><input id="authName" placeholder="نام و نام خانوادگی (برای ثبت‌نام)"><input id="authPhone" placeholder="شماره موبایل"><input id="authEmail" type="email" placeholder="ایمیل"><input id="authPass" type="password" placeholder="رمز عبور حداقل ۶ کاراکتر"><button class="primary">ورود</button><button type="button" class="secondary" id="signupBtn">ثبت‌نام</button><div class="auth-msg" id="authMsg"></div></form>`;document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();if(!enabled)return showOff();const email=authEmail.value.trim(),password=authPass.value;if(!email||!password)return authMsg.textContent='ایمیل و رمز عبور را وارد کنید.';const {error}=await sb.auth.signInWithPassword({email,password});if(error){authMsg.textContent='ورود ناموفق: '+error.message;return}close();await refreshUser();toast('خوش آمدید 🌱')};document.getElementById('signupBtn').onclick=async()=>{if(!enabled)return showOff();const email=authEmail.value.trim(),password=authPass.value;const full_name=authName.value.trim(),phone=authPhone.value.trim();if(!email||password.length<6)return authMsg.textContent='ایمیل و رمز عبور (حداقل ۶ کاراکتر) را وارد کنید.';const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name,phone}}});if(error){authMsg.textContent='ثبت‌نام ناموفق: '+error.message;return}authMsg.textContent=data.session?'ثبت‌نام انجام شد.':'ثبت‌نام انجام شد؛ اگر تأیید ایمیل فعال باشد، ایمیل خود را بررسی کنید.'};}
  function showOff(){content.innerHTML='<div class="backend-off">'+(sdkReady?'اتصال به تنظیمات Supabase برقرار است، اما سرویس پاسخ نمی‌دهد. اینترنت و وضعیت پروژه را بررسی کنید.':'کتابخانه Supabase در مرورگر بارگذاری نشده است. اینترنت را روشن کنید و صفحه را دوباره باز کنید.')+'</div>';}
  async function account(){if(!enabled){title.textContent='حساب کاربری';showOff();open();return}const s=await session();if(!s){authForm();open();return}try{await sb.rpc('bootstrap_admin')}catch(e){}const p=await profile();const adminItem=document.getElementById('adminMenuItem');if(adminItem)adminItem.style.display=p?.role==='admin'?'block':'none';title.textContent='پروفایل من';content.innerHTML=`<div class="user-card"><b>${p?.full_name||s.user.email}</b><div>${p?.phone||''}</div><small>${s.user.email}</small></div><div class="account-actions"><button class="secondary" id="ordersMe">سفارش‌های من</button><button class="secondary" id="addressMe">آدرس‌ها</button><button class="primary" id="saveProfile">ویرایش پروفایل</button><button class="secondary" id="logoutMe">خروج</button>${p?.role==='admin'?'<button class="admin-link" id="adminMe">پنل مدیریت</button>':''}</div><div id="accountArea" class="auth-msg" style="margin-top:12px"></div>`;document.getElementById('logoutMe').onclick=async()=>{await sb.auth.signOut();close();await refreshUser();toast('از حساب خارج شدید')};document.getElementById('saveProfile').onclick=editProfile;document.getElementById('ordersMe').onclick=showOrders;document.getElementById('addressMe').onclick=showAddresses;const a=document.getElementById('adminMe');if(a)a.onclick=()=>location.href='admin.html';open()}
  async function editProfile(){const p=await profile();document.getElementById('accountArea').innerHTML=`<form class="auth-form" id="profileForm"><input id="pfName" value="${p?.full_name||''}" placeholder="نام و نام خانوادگی"><input id="pfPhone" value="${p?.phone||''}" placeholder="شماره موبایل"><button class="primary">ذخیره</button><div id="pfMsg"></div></form>`;profileForm.onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('profiles').update({full_name:pfName.value.trim(),phone:pfPhone.value.trim(),updated_at:new Date().toISOString()}).eq('id',(await session()).user.id);pfMsg.textContent=error?error.message:'ذخیره شد ✓';await refreshUser()}}
  async function showOrders(){const area=document.getElementById('accountArea');area.textContent='در حال دریافت سفارش‌ها...';const {data,error}=await sb.from('orders').select('id,status,total,created_at,payment_status').order('created_at',{ascending:false}).limit(20);if(error){area.textContent=error.message;return}area.innerHTML=data?.length?data.map(o=>`<div class="address-card"><b>سفارش ${String(o.id).slice(0,8)}</b><div>وضعیت: ${statusFa(o.status)}</div><div>مبلغ: ${money2(o.total)} تومان</div><small>${new Date(o.created_at).toLocaleString('fa-IR')}</small></div>`).join(''):'هنوز سفارشی ثبت نشده است.'}
  function statusFa(s){return ({new:'جدید',confirmed:'تأیید شده',preparing:'در حال آماده‌سازی',out_for_delivery:'در مسیر ارسال',delivered:'تحویل شده',cancelled:'لغو شده'})[s]||s}
  async function showAddresses(){const area=document.getElementById('accountArea');const {data,error}=await sb.from('addresses').select('*').order('created_at',{ascending:false});if(error){area.textContent=error.message;return}area.innerHTML=`<button class="primary" id="newAddr">+ افزودن آدرس</button><div class="address-list">${(data||[]).map(a=>`<div class="address-card"><b>${a.title}</b><div>${a.address_text}</div>${a.lat?`<small>موقعیت ثبت شده ✓</small>`:''}</div>`).join('')}</div>`;document.getElementById('newAddr').onclick=()=>addAddress(area)}
  function addAddress(area){area.innerHTML=`<form class="auth-form" id="addrForm"><input id="addrTitle" value="خانه" placeholder="عنوان آدرس"><textarea id="addrText" rows="3" placeholder="آدرس کامل">نجف آباد، </textarea><input id="addrLat" placeholder="عرض جغرافیایی (اختیاری)"><input id="addrLng" placeholder="طول جغرافیایی (اختیاری)"><button class="primary">ذخیره آدرس</button><div id="addrMsg"></div></form>`;addrForm.onsubmit=async e=>{e.preventDefault();const s=await session();const {error}=await sb.from('addresses').insert({user_id:s.user.id,title:addrTitle.value,address_text:addrText.value,lat:addrLat.value?Number(addrLat.value):null,lng:addrLng.value?Number(addrLng.value):null,is_default:false});addrMsg.textContent=error?error.message:'آدرس ذخیره شد ✓';if(!error)showAddresses()}}
  async function checkoutReal(){if(!enabled){toast('ابتدا اتصال دیتابیس را تنظیم کنید');return}const s=await session();if(!s){authForm();open();return}const ids=Object.entries(window.cart||{}).filter(([,q])=>q>0).map(([id,q])=>({product_id:id,quantity:q}));
    // ids are local slugs in V2; map them to DB ids.
    const {data:prods,error}=await sb.from('products').select('id,slug').in('slug',ids.map(x=>x.product_id));if(error){toast('خطا در دریافت محصولات');return}const items=ids.map(x=>{const p=prods.find(p=>p.slug===x.product_id);return p?{product_id:p.id,quantity:x.quantity}:null}).filter(Boolean);if(!items.length){toast('سبد خرید خالی است');return}const {data:addr}=await sb.from('addresses').select('id').eq('user_id',s.user.id).eq('is_default',true).limit(1);const {data:oid,error:e}=await sb.rpc('place_order',{p_address_id:addr?.[0]?.id||null,p_items:items,p_note:''});if(e){toast('ثبت سفارش ناموفق: '+e.message);return}window.cart={};updateCart();closePanels();toast('سفارش با موفقیت ثبت شد ✓');account()}
  async function refreshUser(){if(!enabled)return;const p=await profile();const btn=document.getElementById('profileBtn');if(btn)btn.title=p?('سلام '+(p.full_name||'کاربر')):'ورود';const adminItem=document.getElementById('adminMenuItem');if(adminItem)adminItem.style.display=p?.role==='admin'?'block':'none';}
  document.getElementById('profileBtn').onclick=account;
  document.getElementById('checkoutBtn').onclick=checkoutReal;
  sb?.auth.onAuthStateChange(()=>refreshUser());
  refreshUser();
  loadProductsFromBackend();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script></body></html>
