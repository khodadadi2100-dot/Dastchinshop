<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008d4f"><title>دستچین | خرید محصولات تازه</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--g:#008d4f;--g2:#087a4b;--navy:#082e5b;--bg:#f2f8f6;--muted:#788597;--line:#e5ece9;--red:#ef3c3c;--shadow:0 6px 24px rgba(20,70,60,.11)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eef8f5,#fff 42%,#eef8f5);font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--navy)}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:1050px;margin:auto;padding-bottom:88px}.header{height:140px;background:linear-gradient(180deg,#006f3f,#008d4f);position:relative;overflow:hidden;border-radius:0 0 28px 28px;box-shadow:var(--shadow)}.header:after{content:"";position:absolute;left:50%;top:-72px;transform:translateX(-50%);width:min(600px,76vw);height:180px;background:#fff;border-radius:0 0 110px 110px}.brand{position:absolute;z-index:3;left:50%;top:10px;transform:translateX(-50%);width:min(420px,62vw);height:122px;display:grid;place-items:center}.brand img{width:100%;height:112px;object-fit:contain}.hamb,.topcart,.account{position:absolute;z-index:5;background:none;color:#fff}.hamb{right:24px;top:39px;width:48px}.hamb i{display:block;height:5px;background:#fff;border-radius:9px;margin:7px 0}.account{left:22px;top:28px;width:58px;height:58px;border-radius:50%;background:#fff;color:var(--g);font-size:30px}.topcart{left:88px;top:40px;font-size:31px}.badge{position:absolute;right:-9px;top:-10px;background:var(--red);border:2px solid #fff;color:#fff;border-radius:50%;min-width:25px;height:25px;display:grid;place-items:center;font-size:12px;font-weight:900}.hero{margin:18px 20px 14px;overflow:hidden;border-radius:34px;box-shadow:var(--shadow);background:#fff}.hero img{display:block;width:100%;aspect-ratio:1024/390;object-fit:cover}.search{height:58px;margin:0 20px 16px;background:#fff;border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 18px}.search span{font-size:28px}.search input{border:0;outline:0;width:100%;background:none;text-align:right;color:var(--navy);font-size:17px}.box{margin:0 20px 18px;background:#fff;border-radius:25px;box-shadow:var(--shadow);padding:16px}.box h2{margin:0 0 12px;font-size:22px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.cat{height:112px;background:#f6f8f8;border-radius:22px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px;color:#687687;font-weight:900}.catpic{height:72px;width:100%;background:#eaf5f0;border-radius:18px;display:grid;place-items:center;font-size:39px}.section{padding:0 20px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.sectionHead h2{margin:0;font-size:24px}.sectionHead button{background:none;color:#178bcf;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border-radius:22px;padding:10px;box-shadow:var(--shadow);overflow:hidden}.pimg{height:180px;border-radius:17px;background:#f7faf9;display:grid;place-items:center;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:contain}.pname{text-align:center;font-weight:900;margin-top:8px}.meta{text-align:center;color:var(--muted);font-size:12px;margin-top:3px}.price{text-align:center;color:#087a4b;font-weight:900;margin:6px}.add{width:100%;height:40px;border-radius:13px;background:#fff;border:1.5px solid var(--g);color:var(--g);font-weight:900}.add:active{transform:scale(.98)}.bottom{position:fixed;z-index:60;bottom:0;left:50%;transform:translateX(-50%);width:min(1050px,100%);height:78px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -5px 20px #0002}.nav{background:none;color:#8a93a0;display:grid;place-items:center;font-size:24px}.nav small{font-size:11px}.nav.active{color:var(--g)}.overlay{position:fixed;inset:0;background:#0007;z-index:80;display:none}.overlay.show{display:block}.drawer,.cart{position:fixed;top:0;bottom:0;width:min(430px,94vw);background:#fff;z-index:90;box-shadow:0 0 35px #0003;display:flex;flex-direction:column}.drawer{right:0;transform:translateX(105%);transition:.25s}.cart{left:0;transform:translateX(-105%);transition:.25s}.drawer.open,.cart.open{transform:translateX(0)}.panelHead{background:linear-gradient(135deg,#006f3f,#09a553);color:#fff;padding:22px 18px;display:flex;justify-content:space-between;align-items:center;font-size:22px}.panelHead button{background:none;color:#fff;font-size:30px}.panelBody{padding:16px;overflow:auto}.primary{width:100%;padding:13px;border-radius:14px;background:var(--g);color:#fff;font-weight:900}.secondary{width:100%;padding:12px;border-radius:14px;background:#31557d;color:#fff;font-weight:900;margin-top:8px}.cartRow{display:grid;grid-template-columns:60px 1fr auto;gap:9px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.cartRow img{width:60px;height:60px;object-fit:contain;border-radius:12px;background:#f7faf9}.qty{display:flex;align-items:center;gap:5px}.qty button{width:30px;height:30px;border-radius:9px;background:#e8f5ed;color:var(--g);font-weight:900}.cartFoot{margin-top:auto;padding:16px;border-top:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0007;z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modalBox{background:#fff;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px}.modalBox h2{margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #d8e2de;border-radius:14px;outline:0}.field input:focus,.field textarea:focus{border-color:var(--g)}.msg{margin-top:10px;font-size:13px;line-height:1.9}.err{padding:12px;border-radius:12px;background:#fff0f0;color:#a52a2a}.ok{padding:14px;border-radius:14px;background:#edf9f1;color:#087a4b;line-height:2}.track{padding:14px;background:#f7faf9;border-radius:18px;margin:10px 0}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:15px 0}.step{height:58px;text-align:center;font-size:10px;color:#a0a8b2;display:flex;flex-direction:column;align-items:center;gap:4px}.dot{width:28px;height:28px;border-radius:50%;background:#dfe7e3;display:grid;place-items:center}.step.on{color:var(--g);font-weight:900}.step.on .dot{background:var(--g);color:#fff}.hint{font-size:12px;color:var(--muted);line-height:1.9}@media(max-width:760px){.header{height:140px}.header:after{width:74vw;height:165px}.brand{width:72vw}.brand img{height:108px}.hamb{right:18px}.account{left:18px}.topcart{left:80px}.hero{margin:0 0 14px;border-radius:0 0 28px 28px}.hero img{aspect-ratio:1024/430}.search{margin:12px 14px 15px}.box{margin:0 12px 16px}.cats{gap:7px}.cat{height:98px;font-size:12px}.catpic{height:62px}.section{padding:0 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pimg{height:155px}.sectionHead h2{font-size:20px}.bottom{height:72px}.nav{font-size:21px}}
</style></head><body>
<div class="app"><header class="header"><button class="hamb" id="menuBtn" aria-label="منو"><i></i><i></i><i></i></button><div class="brand"><img src="logo.svg?v=20" alt="دستچین"></div><button class="topcart" id="cartBtn">🛒<span class="badge" id="count">0</span></button><button class="account" id="accountBtn">♙</button></header>
<section class="hero"><img src="hero-approved.jpg" alt="محصولات تازه و باکیفیت دستچین"></section><div class="search"><span>⌕</span><input id="search" placeholder="جستجوی محصولات لبنی..."></div>
<section class="box"><h2>دسته‌بندی محصولات</h2><div class="cats"><div class="cat" data-cat="لبنیات"><div class="catpic">🥛</div>لبنیات</div><div class="cat" data-cat="پروتئین"><div class="catpic">🥩</div>پروتئین</div><div class="cat" data-cat="شوریجات"><div class="catpic">🥒</div>شوریجات</div><div class="cat" data-cat="محلی"><div class="catpic">🧺</div>محلی</div></div></section>
<section class="section"><div class="sectionHead"><h2>محصولات دستچین</h2><button id="refresh">تازه‌سازی</button></div><div class="grid" id="products"></div></section></div>
<nav class="bottom"><button class="nav active">⌂<small>خانه</small></button><button class="nav" id="productsNav">▦<small>محصولات</small></button><button class="nav" id="cartNav">🛒<small>سبد خرید</small></button><button class="nav" id="trackNav">◷<small>پیگیری سفارش</small></button><button class="nav" id="accountNav">♙<small>حساب من</small></button></nav>
<div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="panelHead"><b>منوی دستچین</b><button id="closeMenu">×</button></div><div class="panelBody"><button class="primary" id="loginMenu">ورود / ثبت‌نام</button><button class="secondary" id="trackMenu">پیگیری سفارش</button><a href="admin.html" style="display:block;text-align:center;text-decoration:none;margin-top:12px;padding:12px;border-radius:14px;background:#082e5b;color:#fff;font-weight:900">پنل مدیریت</a><p class="hint">چینش تازه، سالم و ارسال مستقیم تا خانه شما.</p></div></aside>
<aside class="cart" id="cart"><div class="panelHead"><b>سبد خرید</b><button id="closeCart">×</button></div><div class="panelBody" id="cartList"></div><div class="cartFoot"><div id="total" style="margin-bottom:10px"></div><button class="primary" id="checkout">ادامه ثبت سفارش</button></div></aside>
<div class="modal" id="modal"><div class="modalBox" id="modalContent"></div></div><div id="toast" style="position:fixed;z-index:120;bottom:95px;left:50%;transform:translateX(-50%);background:#063e2e;color:#fff;padding:11px 18px;border-radius:13px;display:none"></div>
<script src="supabase-config.js"></script><script>
const db=(window.DASTCHIN_SUPABASE_URL&&window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY)?supabase.createClient(window.DASTCHIN_SUPABASE_URL,window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const fallback=[{id:1,name:'شیر محلی',meta:'۱ لیتری',price:76000,img:'product-milk.jpg',category:'لبنیات'},{id:2,name:'ماست',meta:'۱.۵ کیلوگرم',price:153000,img:'product-yogurt.jpg',category:'لبنیات'},{id:3,name:'دوغ',meta:'۱.۵ لیتری',price:96000,img:'product-doogh.jpg',category:'لبنیات'},{id:4,name:'پنیر محلی',meta:'۱ کیلوگرم',price:220000,img:'product-cheese.jpg',category:'لبنیات'},{id:5,name:'خامه محلی',meta:'۲۰۰ گرمی',price:27000,img:'product-cream.jpg',category:'لبنیات'},{id:6,name:'ماست چکیده',meta:'۱ کیلوگرم',price:320000,img:'product-strained.jpg',category:'لبنیات'},{id:7,name:'ماست و موسیر',meta:'۱ کیلوگرم',price:210000,img:'product-musir.jpg',category:'لبنیات'},{id:8,name:'کشک سنتی',meta:'۴۵۰ گرمی',price:28000,img:'product-kashk.jpg',category:'لبنیات'}];
let products=[],cart=JSON.parse(localStorage.getItem('dastchin_cart')||'{}'),activeCat='';const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}function save(){localStorage.setItem('dastchin_cart',JSON.stringify(cart));renderCart()}function openPanel(id){$(id).classList.add('open');$('overlay').classList.add('show')}function closePanels(){['drawer','cart'].forEach(x=>$(x).classList.remove('open'));$('overlay').classList.remove('show')}function openModal(h){$('modalContent').innerHTML=h;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
async function loadProducts(){let d=null;if(db){const r=await db.from('products').select('*').eq('active',true).order('sort_order');if(!r.error)d=r.data}products=d&&d.length?d:fallback;renderProducts()}
function renderProducts(){const q=$('search').value.trim();const list=products.filter(p=>(!activeCat||p.category===activeCat)&&(!q||String(p.name).includes(q)||String(p.meta||'').includes(q)));$('products').innerHTML=list.map(p=>`<article class="card"><div class="pimg"><img src="${p.image_url||p.img}" alt="${p.name}" onerror="this.src='product-yogurt.jpg'"></div><div class="pname">${p.name}</div><div class="meta">${p.meta||''}</div><div class="price">${money(p.price)}</div><button class="add" data-id="${p.id}">افزودن به سبد 🛒</button></article>`).join('')||'<div class="hint">محصولی پیدا نشد.</div>';document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(b.dataset.id))}
function add(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;cart[id]??={p,qty:0};cart[id].p=p;cart[id].qty++;save();toast('محصول به سبد اضافه شد')}
function renderCart(){const rows=Object.values(cart);let sum=0;$('count').textContent=rows.reduce((a,x)=>a+x.qty,0);$('cartList').innerHTML=rows.length?rows.map(x=>{sum+=Number(x.p.price)*x.qty;return `<div class="cartRow"><img src="${x.p.image_url||x.p.img}"><div><b>${x.p.name}</b><div>${money(Number(x.p.price)*x.qty)}</div></div><div class="qty"><button data-minus="${x.p.id}">−</button><b>${x.qty}</b><button data-plus="${x.p.id}">+</button></div></div>`}).join(''):'<p class="hint">سبد خرید خالی است.</p>';$('total').textContent=rows.length?'مبلغ کل: '+money(sum):'';document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));$('checkout').style.display=rows.length?'block':'none'}function changeQty(id,n){if(!cart[id])return;cart[id].qty+=n;if(cart[id].qty<=0)delete cart[id];save()}
async function requireSession(){if(!db)return null;const {data}=await db.auth.getSession();return data.session}
function authModal(){openModal(`<h2>ورود / ساخت حساب</h2><div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>رمز عبور</label><input id="pass" type="password" autocomplete="current-password"></div><button class="primary" id="login">ورود</button><button class="secondary" id="signup">ساخت حساب</button><div id="authMsg" class="msg"></div>`);$('login').onclick=async()=>auth(false);$('signup').onclick=async()=>auth(true)}async function auth(signup){const email=$('email').value.trim(),password=$('pass').value;if(!email||password.length<6){$('authMsg').innerHTML='<div class="err">ایمیل و رمز حداقل ۶ کاراکتری لازم است.</div>';return}const r=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});$('authMsg').innerHTML=r.error?'<div class="err">'+r.error.message+'</div>':'<div class="ok">عملیات موفق بود. '+(signup?'اگر تأیید ایمیل فعال باشد، ایمیل تأیید را بررسی کنید.':'وارد شدید.')+'</div>';if(!r.error&&!signup&&r.data.session)setTimeout(closeModal,700)}
function checkoutModal(){if(!Object.keys(cart).length)return;openModal(`<h2>ثبت سفارش</h2><p class="hint">نام و نام خانوادگی، شماره تلفن و آدرس اجباری هستند.</p><div class="field"><label>نام و نام خانوادگی *</label><input id="name" autocomplete="name"></div><div class="field"><label>شماره تلفن *</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxxx"></div><div class="field"><label>آدرس تحویل *</label><textarea id="address" rows="4" autocomplete="street-address"></textarea></div><div class="field"><label>توضیحات سفارش</label><textarea id="note" rows="2"></textarea></div><button class="primary" id="submitOrder">ثبت نهایی سفارش</button><div id="orderMsg" class="msg"></div>`);$('submitOrder').onclick=submitOrder}
async function submitOrder(){const s=await requireSession();if(!s){$('orderMsg').innerHTML='<div class="err">ابتدا وارد حساب شوید.</div>';return}const name=$('name').value.trim(),phone=$('phone').value.replace(/\s/g,''),address=$('address').value.trim(),note=$('note').value.trim();if(!name||!phone||!address){$('orderMsg').innerHTML='<div class="err">نام، شماره تلفن و آدرس اجباری هستند.</div>';return}if(!/^09\d{9}$/.test(phone)){$('orderMsg').innerHTML='<div class="err">شماره تلفن باید ۱۱ رقمی و با 09 باشد.</div>';return}const p=await db.from('profiles').upsert({id:s.user.id,full_name:name,phone},{onConflict:'id'});if(p.error){$('orderMsg').innerHTML='<div class="err">خطا در اطلاعات مشتری: '+p.error.message+'</div>';return}const a=await db.from('addresses').insert({user_id:s.user.id,title:'آدرس منزل',address,address_text:address,is_default:true}).select('id').single();if(a.error){$('orderMsg').innerHTML='<div class="err">خطا در آدرس: '+a.error.message+'</div>';return}const items=Object.values(cart).map(x=>({product_id:Number(x.p.id),quantity:Number(x.qty)}));const o=await db.rpc('place_order',{p_address_id:a.data.id,p_items:items,p_payment_method:'cash_on_delivery',p_note:note||null});if(o.error){$('orderMsg').innerHTML='<div class="err">خطا در ثبت سفارش: '+o.error.message+'</div>';return}localStorage.removeItem('dastchin_cart');cart={};renderCart();$('modalContent').innerHTML='<h2>سفارش ثبت شد ✅</h2><div class="ok">شماره سفارش: <b>'+o.data+'</b><br>برای دیدن وضعیت سفارش، از گزینه «پیگیری سفارش» استفاده کنید.</div><br><button class="primary" onclick="closeModal();openTracking()">پیگیری سفارش</button>'}
async function openTracking(){const s=await requireSession();if(!s){authModal();return}const r=await db.from('orders').select('id,status,total,created_at,updated_at,address_id').eq('user_id',s.user.id).order('created_at',{ascending:false}).limit(30);if(r.error){openModal('<h2>پیگیری سفارش</h2><div class="err">'+r.error.message+'</div>');return}if(!r.data.length){openModal('<h2>پیگیری سفارش</h2><p class="hint">هنوز سفارشی ثبت نکرده‌اید.</p>');return}openModal('<h2>پیگیری سفارش</h2>'+r.data.map(o=>trackCard(o)).join(''))}
function trackCard(o){const statuses=['new','confirmed','preparing','out_for_delivery','delivered'],labels=['ثبت شد','تأیید شد','در حال آماده‌سازی','در حال ارسال','تحویل شد'];const idx=Math.max(0,statuses.indexOf(o.status));return `<div class="track"><div style="display:flex;justify-content:space-between"><b>سفارش #${o.id}</b><b>${money(o.total)}</b></div><div class="hint">${new Date(o.created_at).toLocaleString('fa-IR')}</div><div class="steps">${labels.map((l,i)=>`<div class="step ${i<=idx&&o.status!=='cancelled'?'on':''}"><div class="dot">${i+1}</div>${l}</div>`).join('')}</div>${o.status==='cancelled'?'<div class="err">این سفارش لغو شده است.</div>':''}</div>`}
$('search').oninput=renderProducts;$('refresh').onclick=loadProducts;document.querySelectorAll('.cat').forEach(c=>c.onclick=()=>{activeCat=c.dataset.cat;renderProducts()});$('menuBtn').onclick=()=>openPanel('drawer');$('cartBtn').onclick=()=>openPanel('cart');$('cartNav').onclick=()=>openPanel('cart');$('accountBtn').onclick=authModal;$('accountNav').onclick=authModal;$('trackNav').onclick=openTracking;$('trackMenu').onclick=()=>{closePanels();openTracking()};$('loginMenu').onclick=()=>{closePanels();authModal()};$('checkout').onclick=checkoutModal;$('closeMenu').onclick=closePanels;$('closeCart').onclick=closePanels;$('overlay').onclick=closePanels;$('productsNav').onclick=()=>window.scrollTo({top:document.querySelector('.section').offsetTop-10,behavior:'smooth'});loadProducts();renderCart();
</script></body></html>
