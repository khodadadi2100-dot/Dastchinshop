<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008d4f"><title>دستچین | خرید محصولات لبنی</title><style>:root{--g:#008d4f;--g2:#18b84c;--navy:#082e5b;--muted:#8992a4;--bg:#eef7f5;--shadow:0 3px 16px rgba(31,61,76,.13)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#eaf5f4,#f8fbfb 48%,#eaf6f1);font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--navy)}button,input{font:inherit}button{border:0;cursor:pointer}.app{width:100%;max-width:1024px;margin:auto;padding-bottom:92px;overflow:hidden}.top{height:78px;background:#008d4f;color:#fff;display:flex;align-items:center;padding:10px 18px;z-index:20}.brand{margin:auto;font-size:25px;font-weight:900;color:#fff}.hamb{background:none;color:#fff;width:45px}.hamb span{display:block;height:4px;width:34px;background:#fff;border-radius:5px;margin:6px 0}.top-actions{display:flex;gap:12px;align-items:center}.cart-top{position:relative;background:none;color:#fff;font-size:28px}.profile{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--g);font-size:28px;display:grid;place-items:center}.badge{position:absolute;right:-7px;top:-7px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#f23535;border:2px solid #fff;color:#fff;font-size:11px;font-weight:900}.hero{margin:0;position:relative;overflow:hidden;background:#008d4f;border-radius:0 0 30px 30px;box-shadow:var(--shadow)}.hero img{display:block;width:100%;height:auto;max-height:360px;object-fit:cover;object-position:center}.search{height:54px;background:#fff;margin:14px 20px;border-radius:17px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 14px;gap:8px}.search input{border:0;outline:0;background:none;width:100%;font-size:16px;text-align:right;color:var(--navy)}.box{background:#fff;border-radius:24px;box-shadow:var(--shadow);margin:0 18px 15px;padding:10px}.title,.heading{display:flex;justify-content:space-between;align-items:center}.title h2,.heading h2{margin:0;font-size:21px;font-weight:900}.gridcats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:9px}.cat{height:92px;border-radius:17px;background:#f1f3f7;color:#8b94a5;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px;font-weight:900;overflow:hidden}.cat .pic{height:65px;width:100%;border-radius:14px;background:#008d4f;overflow:hidden}.cat .pic img{width:100%;height:100%;object-fit:cover;display:block}.cat .ico{height:65px;display:grid;place-items:center;font-size:40px;filter:grayscale(1);opacity:.38}.products-section{padding:0 18px}.heading{margin:3px 6px 8px}.heading button{background:none;color:#1488cf;font-weight:900}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:8px;min-width:0;overflow:hidden}.pimg{height:154px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:16px;background:#f7faf9}.pimg img{width:100%;height:100%;object-fit:contain;display:block}.pname{text-align:center;font-weight:900;font-size:16px;margin-top:5px}.pmeta{text-align:center;color:var(--muted);font-size:12px}.price{text-align:center;color:#075b48;font-weight:900;font-size:15px;margin:2px 0 6px}.add{width:100%;height:36px;border-radius:13px;background:linear-gradient(#24b94e,#16a845);color:#fff;font-weight:900}.delivery{display:grid;grid-template-columns:1.65fr 1fr;gap:14px;align-items:center}.map{height:155px;overflow:hidden;border-radius:16px}.map img{width:100%;height:100%;object-fit:cover}.dtext{padding:4px 8px}.dtext h2{margin:0 0 5px;font-size:19px}.dtext p{font-size:13px;line-height:1.8;margin:0 0 8px;color:#31557d}.geo{width:100%;padding:12px 8px;border-radius:18px;background:var(--g);color:#fff;font-weight:900}.checkout{margin:0 18px 12px;border-radius:25px;background:#e4f7e9;box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:10px;align-items:center}.checkout .view{background:var(--g);color:#fff;border-radius:17px;padding:13px;font-weight:900}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(1024px,100%);height:79px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);display:grid;grid-template-columns:repeat(6,1fr);z-index:40;box-shadow:0 -4px 18px rgba(30,60,70,.12)}.nav{position:relative;background:none;color:#8b94a4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:21px}.nav small{font-size:10px;font-weight:800}.nav.active{color:var(--g)}.drawer,.cart-panel{position:fixed;top:0;bottom:0;width:min(370px,90vw);background:#fff;z-index:60;box-shadow:0 0 30px rgba(0,0,0,.25);transition:.25s;display:flex;flex-direction:column}.drawer{right:0;transform:translateX(105%)}.drawer.open{transform:translateX(0)}.cart-panel{left:0;transform:translateX(-105%)}.cart-panel.open{transform:translateX(0)}.panel-head{background:var(--g);color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center}.panel-head button{background:none;color:#fff;font-size:30px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;opacity:0;pointer-events:none;transition:.2s}.overlay.show{opacity:1;pointer-events:auto}.cart-list{overflow:auto}.cart-row{display:grid;grid-template-columns:58px 1fr auto;gap:9px;align-items:center;padding:13px 16px;border-bottom:1px solid #eee}.cart-row img{width:58px;height:58px;object-fit:contain;border-radius:12px}.qty{display:flex;gap:5px;align-items:center}.qty button{width:28px;height:28px;border-radius:8px;background:#eaf7ef;color:var(--g);font-weight:900}.cart-foot{margin-top:auto;padding:16px;border-top:1px solid #eee}.cart-foot button{width:100%;padding:14px;border-radius:15px;background:var(--g);color:#fff;font-weight:900}.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,20px);opacity:0;z-index:100;background:#073d2d;color:#fff;padding:11px 18px;border-radius:15px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.top{height:70px;padding:8px 12px}.brand{font-size:22px}.hero img{max-height:none}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pimg{height:145px}.pname{font-size:14px}.pmeta{font-size:11px}.price{font-size:14px}.gridcats{gap:7px}.cat{height:84px}.cat .pic,.cat .ico{height:58px}.bottom{height:72px}.nav{font-size:19px}.nav small{font-size:9px}.delivery{grid-template-columns:1fr}.map{height:130px}.checkout{grid-template-columns:1fr}.search{margin:12px 14px}.box{margin-left:12px;margin-right:12px}.products-section{padding:0 12px}}@media(min-width:761px){.top{border-radius:0}.hero{margin:0 8px 14px}.hero img{max-height:430px}.pimg{height:180px}} </style></head><body><div class="app"><header class="top"><button class="hamb" aria-label="منو"><span></span><span></span><span></span></button><div class="brand">دستچین</div><div class="top-actions"><button class="cart-top" aria-label="سبد خرید">🛒<span class="badge">0</span></button><div class="profile">♙</div></div></header><main><section class="hero"><img src="hero-approved.jpg" alt="دستچین"></section><div class="search"><span>⌕</span><input placeholder="جستجوی محصولات لبنی..."></div><section class="box"><div class="title"><h2>دسته‌بندی محصولات</h2></div><div class="gridcats"><div class="cat active"><div class="pic">🥛</div><span>لبنیات</span></div><div class="cat"><div class="ico">🥩</div><span>پروتئین</span></div><div class="cat"><div class="ico">🥒</div><span>شوریجات</span></div><div class="cat"><div class="ico">🧺</div><span>محلی</span></div></div></section><section class="products-section"><div class="heading"><h2>محصولات</h2><button type="button">مشاهده همه</button></div><div class="products" id="products"></div></section></main></div><nav class="bottom"><button class="nav active">⌂<small>خانه</small></button><button class="nav">▦<small>محصولات</small></button><button class="nav">🛒<small>سبد خرید</small></button><button class="nav">♡<small>علاقه‌مندی</small></button><button class="nav">♙<small>حساب من</small></button><button class="nav">☰<small>بیشتر</small></button></nav><script>const products=[['شیر','product-milk.jpg'],['ماست','product-yogurt.jpg'],['دوغ','product-doogh.jpg'],['پنیر','product-cheese.jpg'],['خامه','product-cream.jpg'],['ماست چکیده','product-strained.jpg'],['ماست و موسیر','product-musir.jpg'],['کشک','product-kashk.jpg']];const box=document.getElementById('products');box.innerHTML=products.map(p=>`<article class="card"><div class="pimg"><img src="${p[1]}" alt="${p[0]}" loading="lazy" onerror="this.style.display='none'"></div><div class="pname">${p[0]}</div><div class="pmeta">محصول تازه دستچین</div><div class="price">برای مشاهده قیمت</div><button class="add">افزودن به سبد</button></article>`).join('');</script></body></html>
