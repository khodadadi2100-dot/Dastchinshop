<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087a4b"><title>دستچین | خرید تازه و مطمئن</title>
<style>
:root{--green:#07834f;--green2:#006b40;--dark:#073b2c;--blue:#123c68;--cream:#f7fbf8;--line:#e5eee9;--muted:#77858a;--red:#e94444;--shadow:0 10px 30px rgba(7,59,44,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eef7f3;color:var(--dark);font-family:Tahoma,"Segoe UI",Arial,sans-serif}.app{width:min(1100px,100%);margin:auto;padding-bottom:94px}.header{height:154px;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--green2),#08a25e);border-radius:0 0 34px 34px;box-shadow:var(--shadow)}.header:before{content:"";position:absolute;width:430px;height:220px;left:50%;top:-130px;transform:translateX(-50%);background:#fff;border-radius:0 0 220px 220px}.brand{position:absolute;z-index:2;left:50%;top:16px;transform:translateX(-50%);width:min(330px,62vw);height:105px;display:grid;place-items:center}.brand img{max-width:100%;max-height:105px;object-fit:contain}.iconBtn{position:absolute;z-index:3;border:0;background:rgba(255,255,255,.13);color:#fff;width:54px;height:54px;border-radius:18px;font-size:27px;cursor:pointer}.menuBtn{right:20px;top:48px}.userBtn{left:20px;top:43px;background:#fff;color:var(--green);border-radius:50%}.cartBtn{left:86px;top:48px}.badge{position:absolute;right:-5px;top:-7px;min-width:23px;height:23px;padding:0 5px;border-radius:99px;background:var(--red);border:2px solid #fff;font-size:11px;display:grid;place-items:center}.hero{margin:18px 18px 12px;background:#fff;border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}.hero img{display:block;width:100%;aspect-ratio:1024/390;object-fit:cover}.searchWrap{margin:0 18px 18px}.search{height:58px;background:#fff;border:1px solid var(--line);border-radius:19px;display:flex;align-items:center;padding:0 16px;box-shadow:var(--shadow)}.search span{font-size:27px;color:var(--green);margin-left:8px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:15px;color:var(--dark);text-align:right}.section{margin:0 18px 22px}.sectionTop{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px}.sectionTop h2{font-size:21px;margin:0}.linkBtn{border:0;background:none;color:#1488ca;font-weight:900;cursor:pointer}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.category{border:1px solid var(--line);background:#fff;border-radius:22px;padding:9px 7px;text-align:center;font-weight:900;color:#53666a;box-shadow:0 5px 18px rgba(7,59,44,.06);cursor:pointer}.category .pic{height:68px;border-radius:17px;background:#eff8f4;display:grid;place-items:center;font-size:36px;margin-bottom:7px}.category.active{border:2px solid var(--green);color:var(--green)}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:10px;box-shadow:0 7px 22px rgba(7,59,44,.07);overflow:hidden}.pimg{height:180px;background:#f8fbfa;border-radius:18px;display:grid;place-items:center;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:contain}.pname{font-weight:900;text-align:center;font-size:15px;margin-top:9px}.meta{text-align:center;color:var(--muted);font-size:11px;margin-top:4px}.price{text-align:center;color:var(--green);font-size:15px;font-weight:900;margin:8px 0}.add{width:100%;height:42px;border:1.5px solid var(--green);background:#fff;color:var(--green);border-radius:14px;font-weight:900;cursor:pointer}.add:hover{background:#eef9f4}.bottom{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(1100px,100%);height:78px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -7px 25px rgba(0,0,0,.10);border-top:1px solid var(--line)}.nav{border:0;background:none;color:#899398;font-size:23px;display:grid;place-items:center;gap:2px;cursor:pointer}.nav small{font-size:10px}.nav.active{color:var(--green);font-weight:900}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:70;display:none}.overlay.show{display:block}.drawer,.cart{position:fixed;z-index:80;top:0;bottom:0;width:min(430px,94vw);background:#fff;box-shadow:0 0 35px rgba(0,0,0,.22);transition:.25s;display:flex;flex-direction:column}.drawer{right:0;transform:translateX(105%)}.cart{left:0;transform:translateX(-105%)}.drawer.open,.cart.open{transform:translateX(0)}.panelHead{padding:22px 18px;background:linear-gradient(135deg,var(--green2),#0aa15e);color:#fff;display:flex;align-items:center;justify-content:space-between;font-size:21px}.close{border:0;background:none;color:#fff;font-size:30px;cursor:pointer}.panelBody{padding:17px;overflow:auto}.primary,.secondary{width:100%;padding:14px;border:0;border-radius:15px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:var(--blue);color:#fff;margin-top:9px}.adminLink{display:block;text-align:center;text-decoration:none;margin-top:9px;padding:13px;border-radius:15px;background:#f0f5f8;color:var(--blue);font-weight:900}.hint{font-size:12px;color:var(--muted);line-height:2}.cartRow{display:grid;grid-template-columns:58px 1fr auto;gap:9px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.cartRow img{width:58px;height:58px;object-fit:contain;border-radius:13px;background:#f7faf9}.qty{display:flex;align-items:center;gap:5px}.qty button{width:29px;height:29px;border:0;border-radius:9px;background:#e8f5ee;color:var(--green);font-weight:900;cursor:pointer}.cartFoot{margin-top:auto;padding:16px;border-top:1px solid var(--line)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modalBox{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:21px}.modalTitle{display:flex;justify-content:space-between;align-items:center}.modalTitle h2{margin:0}.modalClose{border:0;background:#eef4f1;color:var(--dark);width:40px;height:40px;border-radius:12px;font-size:23px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #d9e5df;border-radius:13px;padding:13px;outline:0;font:inherit}.field textarea{min-height:90px}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.toast{position:fixed;z-index:120;bottom:94px;left:50%;transform:translateX(-50%);background:#073b2c;color:#fff;border-radius:14px;padding:11px 17px;display:none;white-space:nowrap}@media(max-width:760px){.header{height:142px}.header:before{width:72vw;height:175px}.brand{width:72vw;height:104px;top:10px}.hero{margin:0 0 14px;border-radius:0 0 28px 28px}.hero img{aspect-ratio:1024/430}.searchWrap{margin:0 13px 16px}.section{margin:0 12px 19px}.categories{gap:7px}.category{font-size:11px;padding:7px 4px;border-radius:18px}.category .pic{height:59px;font-size:31px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{border-radius:20px;padding:8px}.pimg{height:155px}.pname{font-size:14px}.price{font-size:14px}.bottom{height:73px}.nav{font-size:21px}.menuBtn{right:15px}.userBtn{left:15px}.cartBtn{left:78px}}
</style></head>
<body>
<div class="app">
<header class="header"><button class="iconBtn menuBtn" id="menuBtn">☰</button><div class="brand"><img src="logo.svg" alt="دستچین"></div><button class="iconBtn cartBtn" id="cartBtn">🛒<span class="badge" id="count">0</span></button><button class="iconBtn userBtn" id="userBtn">♙</button></header>
<section class="hero"><img src="hero-approved.jpg" alt="محصولات تازه دستچین"></section>
<div class="searchWrap"><div class="search"><span>⌕</span><input id="search" placeholder="جستجوی محصول..."></div></div>
<section class="section"><div class="sectionTop"><h2>دسته‌بندی‌ها</h2><button class="linkBtn" id="clearCat">همه</button></div><div class="categories"><button class="category" data-cat="لبنیات"><div class="pic">🥛</div>لبنیات</button><button class="category" data-cat="پروتئین"><div class="pic">🥩</div>پروتئین</button><button class="category" data-cat="شوریجات"><div class="pic">🥒</div>شوریجات</button><button class="category" data-cat="محلی"><div class="pic">🧺</div>محلی</button></div></section>
<section class="section"><div class="sectionTop"><h2>محصولات دستچین</h2><button class="linkBtn" id="refresh">تازه‌سازی</button></div><div class="products" id="products"></div></section>
</div>
<nav class="bottom"><button class="nav active" id="homeNav">⌂<small>خانه</small></button><button class="nav" id="productsNav">▦<small>محصولات</small></button><button class="nav" id="cartNav">🛒<small>سبد خرید</small></button><button class="nav" id="trackNav">◷<small>پیگیری</small></button><button class="nav" id="accountNav">♙<small>حساب من</small></button></nav>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"><div class="panelHead"><b>منوی دستچین</b><button class="close" id="closeMenu">×</button></div><div class="panelBody"><button class="primary" id="loginBtn">ورود / ثبت‌نام</button><button class="secondary" id="trackBtn">پیگیری سفارش</button><a class="adminLink" href="admin.html">پنل مدیریت</a><p class="hint">خرید ساده، محصولات تازه و ارسال مستقیم تا خانه شما.</p></div></aside>
<aside class="cart" id="cart"><div class="panelHead"><b>سبد خرید</b><button class="close" id="closeCart">×</button></div><div class="panelBody" id="cartList"></div><div class="cartFoot"><div id="total" style="margin-bottom:10px;font-weight:900"></div><button class="primary" id="checkout">ادامه ثبت سفارش</button></div></aside>
<div class="modal" id="modal"><div class="modalBox" id="modalContent"></div></div><div class="toast" id="toast"></div>
<script>
const fallback=[
{id:1,name:'شیر محلی',meta:'۱ لیتری',price:76000,img:'product-milk.jpg',category:'لبنیات'},
{id:2,name:'ماست',meta:'۱.۵ کیلوگرم',price:153000,img:'product-yogurt.jpg',category:'لبنیات'},
{id:3,name:'دوغ',meta:'۱.۵ لیتری',price:96000,img:'product-doogh.jpg',category:'لبنیات'},
{id:4,name:'پنیر محلی',meta:'۱ کیلوگرم',price:220000,img:'product-cheese.jpg',category:'لبنیات'},
{id:5,name:'خامه محلی',meta:'۲۰۰ گرمی',price:27000,img:'product-cream.jpg',category:'لبنیات'},
{id:6,name:'ماست چکیده',meta:'۱ کیلوگرم',price:320000,img:'product-strained.jpg',category:'لبنیات'},
{id:7,name:'ماست و موسیر',meta:'۱ کیلوگرم',price:210000,img:'product-musir.jpg',category:'لبنیات'},
{id:8,name:'کشک سنتی',meta:'۴۵۰ گرمی',price:28000,img:'product-kashk.jpg',category:'لبنیات'}];
let products=[...fallback],cart=JSON.parse(localStorage.getItem('dastchin_cart')||'{}'),activeCat='';
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function save(){localStorage.setItem('dastchin_cart',JSON.stringify(cart));renderCart()}
function openPanel(id){$(id).classList.add('open');$('overlay').classList.add('show')}
function closePanels(){['drawer','cart'].forEach(x=>$(x).classList.remove('open'));$('overlay').classList.remove('show')}
function openModal(html){$('modalContent').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function renderProducts(){const q=$('search').value.trim().toLowerCase();const list=products.filter(p=>(!activeCat||p.category===activeCat)&&(!q||String(p.name).toLowerCase().includes(q)||String(p.meta||'').toLowerCase().includes(q)));$('products').innerHTML=list.length?list.map(p=>`<article class="card"><div class="pimg"><img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'"></div><div class="pname">${p.name}</div><div class="meta">${p.meta||''}</div><div class="price">${money(p.price)}</div><button class="add" onclick="add(${p.id})">افزودن به سبد</button></article>`).join(''):'<div class="empty" style="grid-column:1/-1">محصولی پیدا نشد.</div>'}
function add(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;cart[id]=(cart[id]||0)+1;save();toast('به سبد خرید اضافه شد')}
function renderCart(){let total=0,qty=0;const rows=Object.entries(cart).filter(([,n])=>n>0).map(([id,n])=>{const p=products.find(x=>String(x.id)===String(id));if(!p)return '';total+=p.price*n;qty+=n;return `<div class="cartRow"><img src="${p.img}" alt=""><div><b>${p.name}</b><div class="meta">${money(p.price)}</div><div class="qty"><button onclick="changeQty(${id},-1)">−</button><b>${n}</b><button onclick="changeQty(${id},1)">+</button></div></div><b>${money(p.price*n)}</b></div>`}).join('');$('cartList').innerHTML=rows||'<div class="empty">سبد خرید شما خالی است.</div>';$('total').textContent='جمع کل: '+money(total);$('count').textContent=qty}
function changeQty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save()}
function login(){openModal(`<div class="modalTitle"><h2>ورود / ثبت‌نام</h2><button class="modalClose" onclick="closeModal()">×</button></div><div class="field"><label>شماره موبایل</label><input placeholder="09xxxxxxxxx"></div><button class="primary" onclick="toast('در نسخه بعدی فعال می‌شود');closeModal()">ادامه</button>`)}
function track(){openModal(`<div class="modalTitle"><h2>پیگیری سفارش</h2><button class="modalClose" onclick="closeModal()">×</button></div><div class="field"><label>کد سفارش</label><input id="trackCode" placeholder="مثلاً DC-1001"></div><button class="primary" onclick="toast('کد سفارش بررسی شد');closeModal()">پیگیری</button>`)}
$('menuBtn').onclick=()=>openPanel('drawer');$('cartBtn').onclick=()=>openPanel('cart');$('closeMenu').onclick=closePanels;$('closeCart').onclick=closePanels;$('overlay').onclick=closePanels;$('loginBtn').onclick=login;$('userBtn').onclick=login;$('accountNav').onclick=login;$('trackBtn').onclick=track;$('trackNav').onclick=track;$('cartNav').onclick=()=>openPanel('cart');$('productsNav').onclick=()=>$('products').scrollIntoView({behavior:'smooth'});$('homeNav').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});$('checkout').onclick=()=>{if(!Object.keys(cart).length){toast('سبد خرید خالی است');return}openModal(`<div class="modalTitle"><h2>ثبت سفارش</h2><button class="modalClose" onclick="closeModal()">×</button></div><div class="field"><label>نام و نام خانوادگی</label><input></div><div class="field"><label>شماره تماس</label><input placeholder="09xxxxxxxxx"></div><div class="field"><label>آدرس تحویل</label><textarea></textarea></div><button class="primary" onclick="toast('اطلاعات سفارش ثبت شد');closeModal()">ثبت سفارش</button>`) };
document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;document.querySelectorAll('.category').forEach(x=>x.classList.toggle('active',x===b));renderProducts()});$('clearCat').onclick=()=>{activeCat='';document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));renderProducts()};$('search').oninput=renderProducts;$('refresh').onclick=()=>{renderProducts();toast('محصولات تازه‌سازی شد')};
renderProducts();renderCart();
</script></body></html>
