<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008d4f"><title>دستچین | خرید محصولات لبنی</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#008d4f;--g2:#19b84b;--ink:#082e5b;--muted:#7d899b;--bg:#edf7f4;--card:#fff;--shadow:0 4px 18px rgba(20,60,70,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eaf6f3,#fff 45%,#eaf6f1);font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:1050px;margin:auto;padding-bottom:88px}.top{height:76px;background:var(--g);display:flex;align-items:center;padding:10px 16px;color:#fff;position:relative;z-index:20}.brand{position:absolute;left:50%;transform:translateX(-50%);font-size:25px;font-weight:900}.hamb,.cartTop{background:none;color:#fff}.hamb{width:44px}.hamb i{display:block;height:4px;background:#fff;border-radius:5px;margin:5px}.topRight{margin-right:auto;display:flex;align-items:center;gap:10px}.cartTop{font-size:27px;position:relative}.badge{position:absolute;right:-8px;top:-8px;background:#ef3333;border:2px solid #fff;border-radius:50%;width:22px;height:22px;font-size:10px;display:grid;place-items:center}.profile{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;font-size:25px}.hero{overflow:hidden;background:var(--g);border-radius:0 0 30px 30px;box-shadow:var(--shadow)}.hero img{display:block;width:100%;height:auto;max-height:430px;object-fit:cover;object-position:center}.search{height:54px;margin:14px 18px;background:#fff;border-radius:17px;display:flex;align-items:center;padding:0 14px;box-shadow:var(--shadow)}.search input{width:100%;border:0;outline:0;text-align:right;background:transparent}.box{margin:0 18px 16px;padding:12px;background:#fff;border-radius:23px;box-shadow:var(--shadow)}h2{font-size:20px;margin:0 0 10px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{height:88px;border-radius:16px;background:#f2f4f6;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px;font-weight:900;color:#7c8798}.cat .pic{height:60px;width:100%;display:grid;place-items:center;border-radius:13px;background:#e7f4ed;font-size:36px}.section{padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center}.head button{background:none;color:#1389d0;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.card{background:#fff;border-radius:19px;padding:8px;box-shadow:var(--shadow);overflow:hidden}.pimg{height:165px;background:#f7faf9;border-radius:15px;overflow:hidden;display:grid;place-items:center}.pimg img{width:100%;height:100%;object-fit:contain}.pname{text-align:center;font-weight:900;margin-top:6px}.meta{text-align:center;color:var(--muted);font-size:11px}.price{text-align:center;color:#075b48;font-weight:900;margin:4px}.add{width:100%;height:36px;border-radius:12px;background:linear-gradient(#24b94e,#12a343);color:#fff;font-weight:900}.bottom{position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);width:min(1050px,100%);height:76px;background:rgba(255,255,255,.98);display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -4px 18px rgba(0,0,0,.1)}.nav{background:none;color:#8791a0;display:grid;place-items:center;font-size:21px}.nav small{font-size:10px}.nav.active{color:var(--g)}.drawer,.cart{position:fixed;top:0;bottom:0;width:min(390px,92vw);background:#fff;z-index:70;box-shadow:0 0 30px #0003;transition:.25s;padding:0;display:flex;flex-direction:column}.drawer{right:0;transform:translateX(105%)}.cart{left:0;transform:translateX(-105%)}.drawer.open{transform:translateX(0)}.cart.open{transform:translateX(0)}.panelHead{background:var(--g);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}.panelHead button{background:none;color:#fff;font-size:28px}.panelBody{padding:16px;overflow:auto}.overlay{position:fixed;inset:0;background:#0006;z-index:65;display:none}.overlay.show{display:block}.cartRow{display:grid;grid-template-columns:58px 1fr auto;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.cartRow img{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#f7faf9}.qty{display:flex;align-items:center;gap:5px}.qty button{width:28px;height:28px;border-radius:8px;background:#e8f5ed;color:var(--g);font-weight:900}.cartFoot{margin-top:auto;padding:16px;border-top:1px solid #eee}.primary{width:100%;padding:13px;border-radius:14px;background:var(--g);color:#fff;font-weight:900}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #dce4e8;border-radius:12px;outline:0}.modal{position:fixed;inset:0;background:#0006;z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modalBox{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:25px 25px 0 0;padding:18px}.toast{position:fixed;z-index:120;bottom:95px;left:50%;transform:translate(-50%,20px);opacity:0;background:#063e2e;color:#fff;padding:11px 18px;border-radius:14px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.top{height:70px}.brand{font-size:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pimg{height:145px}.cats{gap:7px}.cat{height:82px}.cat .pic{height:55px}.section{padding:0 12px}.box{margin-left:12px;margin-right:12px}.search{margin:12px 14px}.bottom{height:70px}.nav{font-size:19px}} </style></head><body><div class="app"><header class="top"><button class="hamb" id="menuBtn"><i></i><i></i><i></i></button><div class="brand">دستچین</div><div class="topRight"><button class="cartTop" id="cartBtn">🛒<span class="badge" id="count">0</span></button><button class="profile" id="accountBtn">♙</button></div></header><main><section class="hero"><img src="hero-approved.jpg" alt="دستچین"></section><div class="search"><span>⌕</span><input id="search" placeholder="جستجوی محصولات لبنی..."></div><section class="box"><h2>دسته‌بندی محصولات</h2><div class="cats"><div class="cat"><div class="pic">🥛</div>لبنیات</div><div class="cat"><div class="pic">🥩</div>پروتئین</div><div class="cat"><div class="pic">🥒</div>شوریجات</div><div class="cat"><div class="pic">🧺</div>محلی</div></div></section><section class="section"><div class="head"><h2>محصولات دستچین</h2><button id="refresh">تازه‌سازی</button></div><div class="grid" id="products"></div></section></main></div><nav class="bottom"><button class="nav active">⌂<small>خانه</small></button><button class="nav" id="productsNav">▦<small>محصولات</small></button><button class="nav" id="cartNav">🛒<small>سبد خرید</small></button><button class="nav">♡<small>علاقه‌مندی</small></button><button class="nav" id="accountNav">♙<small>حساب من</small></button></nav><div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="panelHead"><b>منوی دستچین</b><button id="closeMenu">×</button></div><div class="panelBody"><button class="primary" id="loginMenu">ورود / ثبت‌نام</button><p>خرید آسان، محصولات تازه و ارسال در محدوده خدمت‌رسانی دستچین.</p></div></aside><aside class="cart" id="cart"><div class="panelHead"><b>سبد خرید</b><button id="closeCart">×</button></div><div class="panelBody" id="cartList"></div><div class="cartFoot"><div id="total"></div><button class="primary" id="checkout">ادامه ثبت سفارش</button></div></aside><div class="modal" id="modal"><div class="modalBox" id="modalContent"></div></div><div class="toast" id="toast"></div><script src="supabase-config.js"></script><script>const cfg=window.DASTCHIN_SUPABASE_URL&&window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY?supabase.createClient(window.DASTCHIN_SUPABASE_URL,window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY):null;const fallback=[{id:'milk',name:'شیر',meta:'۱ لیتری',price:38000,img:'product-milk.jpg'},{id:'yogurt',name:'ماست',meta:'۹۰۰ گرمی',price:34000,img:'product-yogurt.jpg'},{id:'doogh',name:'دوغ',meta:'۱.۵ لیتری',price:28000,img:'product-doogh.jpg'},{id:'cheese',name:'پنیر',meta:'۴۰۰ گرمی',price:48000,img:'product-cheese.jpg'},{id:'cream',name:'خامه',meta:'۲۰۰ گرمی',price:48000,img:'product-cream.jpg'},{id:'strained',name:'ماست چکیده',meta:'۴۰۰ گرمی',price:52000,img:'product-strained.jpg'},{id:'musir',name:'ماست و موسیر',meta:'۵۰۰ گرمی',price:48000,img:'product-musir.jpg'},{id:'kashk',name:'کشک',meta:'۴۵۰ گرمی',price:45000,img:'product-kashk.jpg'}];let products=[],cart=JSON.parse(localStorage.getItem('dastchin_cart')||'{}');const $=id=>document.getElementById(id),toast=m=>{ $('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)};const money=n=>Number(n).toLocaleString('fa-IR')+' تومان';function save(){localStorage.setItem('dastchin_cart',JSON.stringify(cart));renderCart()}function openPanel(x){$(x).classList.add('open');$('overlay').classList.add('show')}function closePanels(){['drawer','cart'].forEach(x=>$(x).classList.remove('open'));$('overlay').classList.remove('show')}function img(p){return p.image_url||p.img}async function loadProducts(){let data=null;if(cfg){const r=await cfg.from('products').select('*').eq('active',true).order('sort_order');data=r.data}products=data&&data.length?data:fallback;renderProducts()}function renderProducts(){const q=$('search').value.trim();const list=products.filter(p=>!q||p.name.includes(q));$('products').innerHTML=list.map(p=>`<article class="card"><div class="pimg"><img src="${img(p)}" alt="${p.name}" onerror="this.onerror=null;this.src='product-yogurt.jpg'"></div><div class="pname">${p.name}</div><div class="meta">${p.meta||'محصول تازه دستچین'}</div><div class="price">${money(p.price)}</div><button class="add" data-id="${p.id}">افزودن به سبد</button></article>`).join('');document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(b.dataset.id))}function add(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;cart[id]??={p,qty:0};cart[id].p=p;cart[id].qty++;save();toast('محصول به سبد اضافه شد')}function renderCart(){const rows=Object.values(cart);let sum=0;$('count').textContent=rows.reduce((a,x)=>a+x.qty,0);$('cartList').innerHTML=rows.length?rows.map(x=>{sum+=x.p.price*x.qty;return `<div class="cartRow"><img src="${img(x.p)}"><div><b>${x.p.name}</b><div>${money(x.p.price*x.qty)}</div></div><div class="qty"><button data-q="-" data-id="${x.p.id}">−</button><b>${x.qty}</b><button data-q="+" data-id="${x.p.id}">+</button></div></div>`}).join(''):'<p style="text-align:center;padding:30px">سبد خرید خالی است.</p>';$('total').innerHTML=`<b>مجموع: ${money(sum)}</b>`;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const x=cart[b.dataset.id];x.qty+=b.dataset.q==='+'?1:-1;if(x.qty<=0)delete cart[b.dataset.id];save()})}async function authUser(){if(!cfg)return null;const r=await cfg.auth.getUser();return r.data.user||null}function showLogin(){openModal(`<h2>ورود / ثبت‌نام</h2><div class="field"><label>ایمیل</label><input id="email" type="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password"></div><button class="primary" id="login">ورود</button><button class="primary" id="signup" style="margin-top:8px;background:#31557d">ساخت حساب</button><p id="authMsg"></p>`);$('login').onclick=()=>doAuth(false);$('signup').onclick=()=>doAuth(true)}async function doAuth(signup){const email=$('email').value.trim(),password=$('password').value;if(!cfg)return;$('authMsg').textContent='در حال بررسی...';const r=signup?await cfg.auth.signUp({email,password}):await cfg.auth.signInWithPassword({email,password});$('authMsg').textContent=r.error?r.error.message:(signup?'حساب ساخته شد؛ ایمیل را تأیید کنید.':'ورود موفق بود.');if(!r.error&&!signup)closeModal()}function openModal(html){$('modalContent').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}async function checkout(){const rows=Object.values(cart);if(!rows.length)return toast('سبد خرید خالی است');const u=await authUser();if(!u){showLogin();return}let address=null;if(cfg){const r=await cfg.from('addresses').select('*').eq('user_id',u.id).order('created_at',{ascending:false}).limit(1);address=r.data?.[0]}openModal(`<h2>ثبت سفارش</h2><div class="field"><label>آدرس تحویل</label><textarea id="address" rows="4" placeholder="آدرس کامل خود را وارد کنید">${address?.address_text||''}</textarea></div><div class="field"><label>توضیحات</label><textarea id="note" rows="2" placeholder="مثلاً زنگ بزنید"></textarea></div><button class="primary" id="place">ثبت نهایی سفارش</button><p id="orderMsg"></p>`);$('place').onclick=()=>placeOrder(u)}async function placeOrder(u){const addressText=$('address').value.trim();if(!addressText)return $('orderMsg').textContent='آدرس را وارد کنید.';if(!cfg)return;let a=await cfg.from('addresses').insert({user_id:u.id,title:'آدرس من',address_text:addressText,is_default:true}).select().single();if(a.error)return $('orderMsg').textContent=a.error.message;const items=Object.values(cart).map(x=>({product_id:x.p.id,quantity:x.qty}));const r=await cfg.rpc('place_order',{p_address_id:a.data.id,p_items:items,p_note:$('note').value||''});if(r.error){$('orderMsg').textContent=r.error.message;return}cart={};save();closeModal();closePanels();toast('سفارش با موفقیت ثبت شد: '+String(r.data).slice(0,8));} $('menuBtn').onclick=()=>openPanel('drawer');$('closeMenu').onclick=closePanels;$('cartBtn').onclick=()=>openPanel('cart');$('cartNav').onclick=()=>openPanel('cart');$('closeCart').onclick=closePanels;$('overlay').onclick=closePanels;$('checkout').onclick=checkout;$('accountBtn').onclick=showLogin;$('accountNav').onclick=showLogin;$('loginMenu').onclick=showLogin;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('search').oninput=renderProducts;$('refresh').onclick=loadProducts;$('productsNav').onclick=()=>$('products').scrollIntoView({behavior:'smooth'});loadProducts();renderCart();</script></body></html>
