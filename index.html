<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008d4f"><title>دستچین | خرید محصولات تازه</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#008d4f;--green2:#12a94b;--dark:#063e2e;--ink:#082e5b;--muted:#788597;--bg:#eef8f5;--card:#fff;--line:#e6ece9;--shadow:0 6px 24px rgba(20,70,60,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(#e9f7f3,#fff 45%,#eef8f5);font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:1050px;margin:auto;padding-bottom:90px}
.top{height:82px;background:linear-gradient(135deg,#007d46,#08a354);display:flex;align-items:center;padding:10px 18px;color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 3px 14px #063e2e33}.hamb,.cartTop{background:none;color:#fff}.hamb{width:48px;padding:4px}.hamb i{display:block;height:4px;background:#fff;border-radius:8px;margin:5px auto;width:30px}.topRight{margin-right:auto;display:flex;align-items:center;gap:12px}.cartTop{font-size:28px;position:relative}.badge{position:absolute;right:-8px;top:-7px;background:#ef3c3c;border:2px solid #fff;border-radius:50%;min-width:23px;height:23px;font-size:11px;display:grid;place-items:center}.profile{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-size:25px}
.brand{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;color:#fff;font-weight:900;font-size:25px;white-space:nowrap}.brandMark{width:34px;height:34px;display:grid;place-items:center;border:2px solid #fff;border-radius:12px 12px 16px 16px;font-size:20px;transform:rotate(-3deg)}
.hero{overflow:hidden;background:#fff;border-radius:0 0 32px 32px;box-shadow:var(--shadow);margin-bottom:14px}.hero img{display:block;width:100%;height:auto;aspect-ratio:1024/390;object-fit:cover;object-position:center}.search{height:58px;margin:0 18px 16px;background:#fff;border-radius:20px;display:flex;align-items:center;padding:0 16px;box-shadow:var(--shadow);border:1px solid #edf2ef}.search span{font-size:25px}.search input{width:100%;border:0;outline:0;text-align:right;background:transparent;color:var(--ink);font-size:16px}.box{margin:0 18px 18px;padding:15px;background:#fff;border-radius:24px;box-shadow:var(--shadow)}h2{font-size:21px;margin:0 0 12px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cat{height:96px;border-radius:18px;background:#f4f7f6;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px;font-weight:900;color:#667486}.cat .pic{height:62px;width:100%;display:grid;place-items:center;border-radius:15px;background:#e8f5ef;font-size:35px}.section{padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head button{background:none;color:#1389d0;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border-radius:20px;padding:9px;box-shadow:var(--shadow);overflow:hidden;min-width:0}.pimg{height:175px;background:#f7faf9;border-radius:16px;overflow:hidden;display:grid;place-items:center}.pimg img{width:100%;height:100%;object-fit:contain;display:block}.pname{text-align:center;font-weight:900;margin-top:7px;min-height:24px}.meta{text-align:center;color:var(--muted);font-size:11px;margin-top:2px}.price{text-align:center;color:#075b48;font-weight:900;margin:5px}.add{width:100%;height:38px;border-radius:12px;background:linear-gradient(#22b84e,#0da344);color:#fff;font-weight:900}
.bottom{position:fixed;z-index:60;bottom:0;left:50%;transform:translateX(-50%);width:min(1050px,100%);height:78px;background:rgba(255,255,255,.98);display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -5px 20px #00000018}.nav{background:none;color:#8791a0;display:grid;place-items:center;font-size:21px;padding:6px}.nav small{font-size:11px}.nav.active{color:var(--green)}
.drawer,.cart{position:fixed;top:0;bottom:0;width:min(410px,94vw);background:#fff;z-index:90;box-shadow:0 0 35px #0003;transition:transform .25s ease;display:flex;flex-direction:column}.drawer{right:0;transform:translateX(105%)}.cart{left:0;transform:translateX(-105%)}.drawer.open{transform:translateX(0)}.cart.open{transform:translateX(0)}.panelHead{background:linear-gradient(135deg,#006f3e,#09a553);color:#fff;padding:20px 18px;display:flex;justify-content:space-between;align-items:center;font-size:20px}.panelHead button{background:none;color:#fff;font-size:30px;line-height:1}.panelBody{padding:16px;overflow:auto}.overlay{position:fixed;inset:0;background:#0007;z-index:80;display:none}.overlay.show{display:block}.cartRow{display:grid;grid-template-columns:58px 1fr auto;gap:9px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.cartRow img{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#f7faf9}.qty{display:flex;align-items:center;gap:5px}.qty button{width:30px;height:30px;border-radius:9px;background:#e8f5ed;color:var(--green);font-weight:900}.cartFoot{margin-top:auto;padding:16px;border-top:1px solid var(--line);background:#fff}.primary{width:100%;padding:13px;border-radius:14px;background:var(--green);color:#fff;font-weight:900}.secondary{width:100%;padding:12px;border-radius:14px;background:#31557d;color:#fff;font-weight:900;margin-top:8px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d9e3df;border-radius:13px;outline:0;background:#fff}.field input:focus,.field textarea:focus{border-color:var(--green)}.modal{position:fixed;inset:0;background:#0007;z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modalBox{background:#fff;width:min(540px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px}.toast{position:fixed;z-index:120;bottom:96px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--dark);color:#fff;padding:12px 18px;border-radius:14px;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.hint{font-size:12px;color:var(--muted);line-height:1.8}
@media(max-width:760px){.top{height:72px}.brand{font-size:23px}.brandMark{width:31px;height:31px;font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pimg{height:150px}.cats{gap:7px}.cat{height:88px}.cat .pic{height:57px}.section{padding:0 12px}.box{margin-left:12px;margin-right:12px}.search{margin:12px 14px 15px}.hero img{aspect-ratio:1024/430}.bottom{height:72px}.nav{font-size:19px}.nav small{font-size:10px}}
</style></head>
<body>
<div class="app"><header class="top"><button class="hamb" id="menuBtn" aria-label="منو"><i></i><i></i><i></i></button><div class="brand"><span class="brandMark">🍃</span><span>دستچین</span></div><div class="topRight"><button class="cartTop" id="cartBtn" aria-label="سبد خرید">🛒<span class="badge" id="count">0</span></button><button class="profile" id="accountBtn" aria-label="حساب">♙</button></div></header>
<main><section class="hero"><img src="hero-approved.jpg" alt="دستچین؛ محصولات تازه و باکیفیت"></section><div class="search"><span>⌕</span><input id="search" placeholder="جستجوی محصولات لبنی..."></div>
<section class="box"><h2>دسته‌بندی محصولات</h2><div class="cats"><div class="cat"><div class="pic">🥛</div>لبنیات</div><div class="cat"><div class="pic">🥩</div>پروتئین</div><div class="cat"><div class="pic">🥒</div>شوریجات</div><div class="cat"><div class="pic">🧺</div>محلی</div></div></section>
<section class="section"><div class="head"><h2>محصولات دستچین</h2><button id="refresh">تازه‌سازی</button></div><div class="grid" id="products"></div></section></main></div>
<nav class="bottom"><button class="nav active">⌂<small>خانه</small></button><button class="nav" id="productsNav">▦<small>محصولات</small></button><button class="nav" id="cartNav">🛒<small>سبد خرید</small></button><button class="nav">♡<small>علاقه‌مندی</small></button><button class="nav" id="accountNav">♙<small>حساب من</small></button></nav>
<div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="panelHead"><b>منوی دستچین</b><button id="closeMenu">×</button></div><div class="panelBody"><button class="primary" id="loginMenu">ورود / ثبت‌نام</button><p class="hint">خرید آسان، محصولات تازه و ارسال در محدوده خدمت‌رسانی دستچین.</p></div></aside>
<aside class="cart" id="cart"><div class="panelHead"><b>سبد خرید</b><button id="closeCart">×</button></div><div class="panelBody" id="cartList"></div><div class="cartFoot"><div id="total" style="margin-bottom:10px"></div><button class="primary" id="checkout">ادامه ثبت سفارش</button></div></aside>
<div class="modal" id="modal"><div class="modalBox" id="modalContent"></div></div><div class="toast" id="toast"></div>
<script src="supabase-config.js"></script><script>
const cfg=window.DASTCHIN_SUPABASE_URL&&window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY?supabase.createClient(window.DASTCHIN_SUPABASE_URL,window.DASTCHIN_SUPABASE_PUBLISHABLE_KEY):null;
const fallback=[{id:'milk',name:'شیر',meta:'۱ لیتری',price:38000,img:'product-milk.jpg'},{id:'yogurt',name:'ماست',meta:'۹۰۰ گرمی',price:34000,img:'product-yogurt.jpg'},{id:'doogh',name:'دوغ',meta:'۱.۵ لیتری',price:28000,img:'product-doogh.jpg'},{id:'cheese',name:'پنیر',meta:'۴۰۰ گرمی',price:48000,img:'product-cheese.jpg'},{id:'cream',name:'خامه',meta:'۲۰۰ گرمی',price:48000,img:'product-cream.jpg'},{id:'strained',name:'ماست چکیده',meta:'۴۰۰ گرمی',price:52000,img:'product-strained.jpg'},{id:'musir',name:'ماست و موسیر',meta:'۵۰۰ گرمی',price:48000,img:'product-musir.jpg'},{id:'kashk',name:'کشک',meta:'۴۵۰ گرمی',price:45000,img:'product-kashk.jpg'}];
let products=[],cart=JSON.parse(localStorage.getItem('dastchin_cart')||'{}');const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('fa-IR')+' تومان';
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function save(){localStorage.setItem('dastchin_cart',JSON.stringify(cart));renderCart()}function openPanel(x){$(x).classList.add('open');$('overlay').classList.add('show')}function closePanels(){['drawer','cart'].forEach(x=>$(x).classList.remove('open'));$('overlay').classList.remove('show')}function openModal(html){$('modalContent').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function img(p){return p.image_url||p.img}async function loadProducts(){let data=null;if(cfg){try{const r=await cfg.from('products').select('*').eq('active',true).order('sort_order');data=r.data}catch(e){}}products=data&&data.length?data:fallback;renderProducts()}
function renderProducts(){const q=$('search').value.trim();const list=products.filter(p=>!q||String(p.name).includes(q));$('products').innerHTML=list.map(p=>`<article class="card"><div class="pimg"><img src="${img(p)}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='product-yogurt.jpg'"></div><div class="pname">${p.name}</div><div class="meta">${p.meta||'محصول تازه دستچین'}</div><div class="price">${money(p.price)}</div><button class="add" data-id="${p.id}">افزودن به سبد</button></article>`).join('');document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(b.dataset.id))}
function add(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;cart[id]??={p,qty:0};cart[id].p=p;cart[id].qty++;save();toast('محصول به سبد اضافه شد')}
function renderCart(){const rows=Object.values(cart);let sum=0;$('count').textContent=rows.reduce((a,x)=>a+x.qty,0);$('cartList').innerHTML=rows.length?rows.map(x=>{sum+=Number(x.p.price)*x.qty;return `<div class="cartRow"><img src="${img(x.p)}" alt="${x.p.name}"><div><b>${x.p.name}</b><div>${money(Number(x.p.price)*x.qty)}</div></div><div class="qty"><button data-q="-" data-id="${x.p.id}">−</button><b>${x.qty}</b><button data-q="+" data-id="${x.p.id}">+</button></div></div>`}).join(''):'<p style="text-align:center;padding:30px">سبد خرید خالی است.</p>';$('total').innerHTML=`<b>مجموع: ${money(sum)}</b>`;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const x=cart[b.dataset.id];x.qty+=b.dataset.q==='+'?1:-1;if(x.qty<=0)delete cart[b.dataset.id];save()})}
async function authUser(){if(!cfg)return null;try{const r=await cfg.auth.getUser();return r.data?.user||null}catch(e){return null}}
function authError(err){const m=err?.message||'خطای ناشناخته';if(m.toLowerCase().includes('anonymous'))return 'ورود مهمان در این پروژه غیرفعال است؛ با ایمیل و رمز وارد شوید.';if(m.toLowerCase().includes('email not confirmed'))return 'ایمیل حساب تأیید نشده است. ایمیل تأیید Supabase را بررسی کنید.';return m}
function showLogin(){openModal(`<h2>ورود / ساخت حساب</h2><div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر"></div><button class="primary" id="login">ورود</button><button class="secondary" id="signup">ساخت حساب جدید</button><p class="hint">برای ثبت سفارش باید حساب مشتری داشته باشید.</p><p id="authMsg"></p>`);$('login').onclick=()=>doAuth(false);$('signup').onclick=()=>doAuth(true)}
async function doAuth(signup){const email=$('email').value.trim(),password=$('password').value;if(!cfg)return $('authMsg').textContent='اتصال به سرویس حساب کاربری برقرار نیست.';if(!email||!password)return $('authMsg').textContent='ایمیل و رمز عبور را وارد کنید.';if(password.length<6)return $('authMsg').textContent='رمز عبور باید حداقل ۶ کاراکتر باشد.';$('authMsg').textContent='در حال بررسی...';const r=signup?await cfg.auth.signUp({email,password}):await cfg.auth.signInWithPassword({email,password});if(r.error){$('authMsg').textContent=authError(r.error);return}if(signup){if(r.data?.session){$('authMsg').textContent='حساب ساخته شد و وارد شدید.';setTimeout(closeModal,500)}else $('authMsg').textContent='حساب ساخته شد؛ ایمیل تأیید را بررسی کنید و سپس وارد شوید.'}else{toast('ورود موفق بود');closeModal()}}
async function checkout(){const rows=Object.values(cart);if(!rows.length)return toast('سبد خرید خالی است');const u=await authUser();if(!u){showLogin();return}let address=null;if(cfg){const r=await cfg.from('addresses').select('*').eq('user_id',u.id).order('created_at',{ascending:false}).limit(1);address=r.data?.[0]}openModal(`<h2>ثبت سفارش</h2><div class="field"><label>آدرس تحویل</label><textarea id="address" rows="4" placeholder="آدرس کامل خود را وارد کنید">${address?.address_text||''}</textarea></div><div class="field"><label>توضیحات سفارش</label><textarea id="note" rows="2" placeholder="مثلاً قبل از تحویل تماس بگیرید"></textarea></div><button class="primary" id="place">ثبت نهایی سفارش</button><p id="orderMsg"></p>`);$('place').onclick=()=>placeOrder(u)}
async function placeOrder(u){const addressText=$('address').value.trim();if(!addressText)return $('orderMsg').textContent='آدرس را وارد کنید.';if(!cfg)return;$('place').disabled=true;$('place').textContent='در حال ثبت...';const a=await cfg.from('addresses').insert({user_id:u.id,title:'آدرس من',address_text:addressText,is_default:true}).select().single();if(a.error){$('orderMsg').textContent=authError(a.error);$('place').disabled=false;$('place').textContent='ثبت نهایی سفارش';return}const items=Object.values(cart).map(x=>({product_id:x.p.id,quantity:x.qty}));const r=await cfg.rpc('place_order',{p_address_id:a.data.id,p_items:items,p_note:$('note').value||''});if(r.error){$('orderMsg').textContent=authError(r.error);$('place').disabled=false;$('place').textContent='ثبت نهایی سفارش';return}cart={};save();closeModal();closePanels();toast('سفارش با موفقیت ثبت شد')}
$('menuBtn').onclick=()=>openPanel('drawer');$('closeMenu').onclick=closePanels;$('cartBtn').onclick=()=>openPanel('cart');$('cartNav').onclick=()=>openPanel('cart');$('closeCart').onclick=closePanels;$('overlay').onclick=closePanels;$('checkout').onclick=checkout;$('accountBtn').onclick=showLogin;$('accountNav').onclick=showLogin;$('loginMenu').onclick=showLogin;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('search').oninput=renderProducts;$('refresh').onclick=loadProducts;$('productsNav').onclick=()=>$('products').scrollIntoView({behavior:'smooth'});loadProducts();renderCart();
</script></body></html>
